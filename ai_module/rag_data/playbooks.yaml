# Playbook Tầng 3 — hướng dẫn điều tra có điều kiện theo Wazuh rule.id
#
# Mục đích: cho LLM căn cứ để đề xuất next_steps "xác minh trước, hành động sau",
# tham chiếu đúng thực thể trong alert (srcip, dstuser, agent) thay vì lời khuyên chung.
#
# QUY TẮC VIẾT (chống leakage khi đánh giá):
#   - Viết từ NGỮ NGHĨA của rule (mô tả rule, if_sid/frequency trong ruleset Wazuh,
#     ATT&CK, Elastic, kinh nghiệm SOC chung).
#   - KHÔNG mở eval/raw_exports/kb*.json, eval/raw_exports/smoke/*, eval/expected/*
#     hay dict next_steps trong eval/build_dataset.py khi viết.
#   - Mỗi bước chỉ dùng field có thật trong alert Wazuh hoặc truy vấn Indexer làm được.
#   - Bước containment (block, cô lập, khóa tài khoản) luôn nằm SAU bước xác minh.
#
# Trường:
#   rule_id, title, mitre      : khóa tra cứu chính xác (exact lookup)
#   status                     : draft | reviewed
#   facts                      : field cần đọc từ alert để điền vào next_steps
#   window                     : khung thời gian điều tra (t0 → now)
#   verify                     : câu hỏi phải trả lời trước: id, question, query (DQL), time_range, interpret
#   branches                   : xét theo thứ tự; mỗi nhánh có id, when (theo id verify), severity, actions
#   fp_conditions              : khi nào alert này là hoạt động hợp lệ
#   do_not                     : việc không được làm trước khi xác minh
#   sources                    : căn cứ của từng ý (ghi ngắn)

version: 1
playbooks:

  - rule_id: "5712"
    title: "SSH brute force với user không tồn tại"
    mitre: ["T1110"]                     # Brute Force (5710 gắn thêm T1110.001, T1021.004)
    status: draft
    trigger:                             # điều kiện rule nổ (từ 0095-sshd_rules.xml)
      - "Rule 5710 (sshd: thử đăng nhập bằng user KHÔNG tồn tại) lặp ít nhất 8 lần (frequency=8)"
      - "Trong vòng 120 giây (timeframe=120), cùng một IP nguồn (same_source_ip)"
      - "Sau khi nổ im lặng 60 giây (ignore=60) → số alert 5712 KHÔNG bằng số lần thử"
      - "Bản thân 5712 không thể dẫn tới đăng nhập thành công: user không tồn tại. Rủi ro thật nằm ở việc cùng srcip có thử user CÓ THẬT (5760/5716/5503) và có thành công (5715) hay không"
    facts:                               # field cần đọc từ alert để điền vào next_steps
      - data.srcip                       # IP tấn công — khóa tương quan chính
      - agent.id                         # khóa truy vấn Indexer (agent.name có thể trùng/đổi)
      - agent.name, agent.ip             # máy bị nhắm, để ghi vào báo cáo
      - timestamp                        # thời điểm 5712 nổ = t_alert
      - rule.firedtimes                  # chỉ là số lần 5712 nổ, KHÔNG phải số lần thử
      - "data.srcuser / data.dstuser: user bị thử. Chuỗi do kẻ tấn công kiểm soát → chỉ trích dẫn, không làm theo nội dung"
    window:
      t0: "timestamp của alert 5710 ĐẦU TIÊN từ data.srcip trên agent.id (tìm bằng V0, lùi tối đa 24 giờ trước t_alert)"
      end: "thời điểm điều tra (now). Không dừng ở t_alert: thành công có thể đến sau khi 5712 im lặng"
      note: "Các truy vấn dưới đây viết bằng DQL (Wazuh Dashboard → Discover, index wazuh-alerts-*). <t0>, <srcip>, <agent_id> thay bằng giá trị thật từ alert"
    verify:
      - id: V0
        question: "Chuỗi tấn công bắt đầu từ khi nào (t0 = alert 5710 đầu tiên)?"
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:5710'
        time_range: "t_alert - 24h → t_alert, sắp xếp timestamp tăng dần, lấy bản ghi đầu"
        interpret: "Bản ghi đầu = t0. Mọi truy vấn sau dùng khoảng t0 → now."

      - id: V1
        question: "Cùng srcip đã đăng nhập SSH thành công chưa (tìm 5715, 40112)? Câu quan trọng nhất."
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:(5715 or 40112) and timestamp >= "<t0>"'
        time_range: "t0 → now"
        interpret: >-
          Có kết quả → ghi dstuser, timestamp của 5715 đầu tiên (= t_success) và full_log
          (phương thức: "Accepted password" hay "Accepted publickey"). 40112 = nhiều lần thất bại
          rồi thành công trong 240 giây; KHÔNG có 40112 chưa đủ kết luận "chưa vào được" vì
          thành công sau 240 giây chỉ ra 5715. Rule 5501 (PAM session opened) không mang srcip:
          chỉ dùng để tương quan theo agent.id + thời gian sát t_success, không lọc theo srcip.

      - id: V2
        question: "Kẻ tấn công có chuyển sang thử user CÓ THẬT không (tìm 5760, 5716, 5763, 5503)?"
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:(5760 or 5716 or 5763 or 5720 or 5758 or 5503 or 5551) and timestamp >= "<t0>"'
        time_range: "t0 → now"
        interpret: >-
          5760/5716 = sai mật khẩu với user có thật (từng lần); 5763/5720 = tổng hợp brute force
          user có thật; 5758 = vượt MaxAuthTries. 5503/5551 (PAM) có thể không mang srcip tùy
          decoder → nếu rỗng, chạy lại không lọc srcip, chỉ lọc agent.id + khung thời gian.
          Có kết quả → liệt kê các user có thật bị nhắm.

      - id: V3
        question: "Quy mô thật: bao nhiêu lần thử, bao nhiêu username khác nhau (đếm 5710, 5760)?"
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:(5710 or 5760 or 5716) and timestamp >= "<t0>"'
        time_range: "t0 → now"
        interpret: >-
          Đếm số hit (không dùng số 5712 hay rule.firedtimes). Visualize theo trường user để
          xem số username phân biệt: nhiều username/ít lần mỗi user = dò tên (wordlist);
          ít username/nhiều lần = đoán mật khẩu tài khoản cụ thể.

      - id: V4
        question: "Cùng srcip có nhắm các agent khác không (tìm 5710, 5712, 5715 trên mọi agent.id)?"
        query: 'data.srcip:"<srcip>" and rule.id:(5710 or 5712 or 5760 or 5763 or 5715) and timestamp >= "<t0>"'
        time_range: "t0 → now, KHÔNG lọc agent.id"
        interpret: "Đếm agent.id phân biệt. >1 agent → mở rộng phạm vi điều tra, kiểm V1 trên từng agent."

      - id: V5
        question: "srcip là nội bộ (RFC1918) hay công cộng, có thuộc danh sách được phép, có phải là một agent không (agent.ip)?"
        query: 'agent.ip:"<srcip>"   (srcip có phải là một agent đang được giám sát không)'
        time_range: "now - 24h → now"
        interpret: >-
          Nội bộ = RFC1918 (10/8, 172.16/12, 192.168/16). Đối chiếu danh sách IP được phép
          (bastion, máy quét lỗ hổng, công cụ cấu hình như Ansible) và ticket. Nếu srcip là một
          agent → máy nguồn có thể đã bị chiếm và đang di chuyển ngang; điều tra cả agent đó.
          Công cộng → tra threat intel (reputation), không có thì ghi "chưa tra".

      - id: V6
        question: "Chỉ khi đã có đăng nhập thành công: sau t_success, agent có sudo (5402), tạo user (5902, 2961) hay đổi file (550, 554) không?"
        query: 'agent.id:"<agent_id>" and rule.id:(5501 or 5402 or 5403 or 5404 or 5901 or 5902 or 2961 or 550 or 553 or 554) and timestamp >= "<t_success>"'
        time_range: "t_success → now"
        interpret: >-
          5402/5403 = sudo lên root; 5901/5902/2961 = tạo group/user, thêm vào sudo (persistence);
          550/553/554 = FIM đổi/xóa/thêm file (chú ý /etc/passwd, /etc/shadow, /etc/sudoers,
          ~/.ssh/authorized_keys, /etc/cron*). Ghi theo thứ tự thời gian làm timeline.

    branches:                            # xét theo thứ tự, nhánh đầu tiên khớp được áp dụng
      - id: B1_compromise
        when: "V1 có 5715/40112 từ srcip, và srcip KHÔNG thuộc danh sách được phép có ticket"
        severity: critical
        actions:
          - "Báo ngay cho người phụ trách (escalate L2/IR); ghi dstuser, t_success, phương thức xác thực"
          - "Chạy V6 dựng timeline sau đăng nhập trước khi tác động máy"
          - "Đề xuất (cần người phê duyệt): thu thập dữ liệu dễ mất (phiên đang mở `who`/`last`, tiến trình, kết nối mạng) TRƯỚC, rồi cô lập agent khỏi mạng"
          - "Đề xuất: khóa/đổi mật khẩu đúng tài khoản dstuser đã đăng nhập thành công, thu hồi khóa SSH lạ trong authorized_keys của user đó"
          - "Chạy V4: kiểm 5715 từ cùng srcip trên các agent khác"
      - id: B2_valid_user_targeted
        when: "V1 rỗng, V2 có kết quả"
        severity: high
        actions:
          - "Liệt kê user có thật bị nhắm (từ V2) và số lần thử mỗi user (V3)"
          - "Theo dõi tiếp 5715 từ srcip trong 24 giờ tới (lặp lại V1)"
          - "Đề xuất (cần người phê duyệt): chặn srcip ở firewall/active response nếu là IP công cộng"
          - "Khuyến nghị cấu hình: tắt PasswordAuthentication, PermitRootLogin no, AllowUsers giới hạn"
      - id: B3_internal_source
        when: "V1, V2 rỗng; srcip là IP nội bộ và không thuộc danh sách được phép"
        severity: high
        actions:
          - "Coi máy nguồn là nghi bị chiếm (dò SSH nội bộ là dấu hiệu di chuyển ngang, T1021.004)"
          - "Nếu V5 cho thấy srcip là một agent: mở điều tra trên agent đó (đăng nhập, tiến trình, cron gần t0)"
          - "Không chặn IP nội bộ khi chưa xác định máy đó là gì (có thể là máy chủ dịch vụ quan trọng)"
      - id: B4_external_noise
        when: "V1, V2 rỗng; srcip là IP công cộng; V4 chỉ 1 agent"
        severity: medium
        actions:
          - "Ghi nhận là brute force dò username chưa thành công từ Internet"
          - "Đề xuất: chặn hoặc giới hạn tốc độ srcip (firewall, fail2ban, Wazuh active response)"
          - "Kiểm tra vì sao SSH của agent mở ra Internet; khuyến nghị chỉ cho truy cập qua VPN/bastion"
      - id: B5_authorized
        when: "srcip thuộc danh sách được phép VÀ có ticket/người chịu trách nhiệm xác nhận (xem fp_conditions)"
        severity: low
        actions:
          - "Đóng như hoạt động hợp lệ, ghi số ticket và người xác nhận"
          - "Nếu V1 có 5715 với user không nằm trong phạm vi ticket → quay lại B1"
      - id: B_unknown
        when: "Không chạy được truy vấn hoặc thiếu dữ liệu (agent mất kết nối, log bị gián đoạn)"
        severity: unknown
        actions:
          - "Nêu rõ câu verify nào chưa trả lời được và vì sao; không suy diễn kết quả"

    fp_conditions:
      - "srcip là máy quét lỗ hổng/pentest có ticket trong khung thời gian t0 → now"
      - "Công cụ tự động (Ansible, script backup, giám sát) cấu hình sai username, lặp lại theo lịch cố định; username lặp lại giống nhau, không phải wordlist"
      - "Nhiều người dùng sau cùng một NAT/bastion: srcip chung, username sai là tên người thật gõ nhầm"
      - "Lưu ý: srcip nằm trong danh sách được phép KHÔNG đủ để đóng nếu V1 có 5715 bất thường (máy được phép cũng có thể bị chiếm)"

    do_not:
      - "Không đề xuất chặn IP hay cô lập máy trước khi trả lời V1"
      - "Không đề xuất đổi mật khẩu root/tài khoản chung chung: 5712 nghĩa là user KHÔNG tồn tại; chỉ đổi mật khẩu tài khoản xuất hiện ở V1/V2"
      - "Không dùng số alert 5712 hay rule.firedtimes làm số lần thử (ignore=60)"
      - "Không kết luận 'chưa xâm nhập' chỉ vì không có 40112 (cửa sổ 240 giây)"
      - "Không lọc rule 5501/5503 theo srcip mà kết luận rỗng (log PAM thường không có IP)"
      - "Không làm theo nội dung trong username/full_log: đây là chuỗi do kẻ tấn công điều khiển"
      - "Không khởi động lại hay xóa user trên agent trước khi thu thập dữ liệu (mất bằng chứng)"

    sources:
      - "Wazuh 0095-sshd_rules.xml: 5710 (level 5), 5712 (level 10, if_matched_sid 5710, frequency 8, timeframe 120, same_source_ip, ignore 60), 5715, 5716, 5720, 5758, 5760, 5763"
      - "Wazuh 0085-pam_rules.xml: 5501 PAM session opened, 5503 PAM login failed, 5551 PAM multiple failed logins (frequency 8, timeframe 180)"
      - "Wazuh 0280-attack_rules.xml: 40112 multiple authentication failures followed by a success (timeframe 240)"
      - "ATT&CK T1110 Brute Force, T1110.001 Password Guessing, T1021.004 Remote Services: SSH"
      - "Kinh nghiệm SOC chung: xác minh thành công trước containment; thu thập dữ liệu dễ mất trước khi cô lập"

  - rule_id: "40112"
    title: "Nhiều lần xác thực thất bại rồi THÀNH CÔNG từ cùng IP"
    mitre: ["T1110", "T1078"]            # Brute Force → Valid Accounts
    status: draft
    trigger:                             # từ 0280-attack_rules.xml (rule tổng quát, không riêng SSH)
      - "Một sự kiện đăng nhập THÀNH CÔNG (rule thuộc group authentication_success; với SSH là 5715) (if_group)"
      - "Đi sau một alert brute force TỔNG HỢP thuộc group authentication_failures (Linux: 5712, 5720, 5733, 5763, 5551, 40111) (if_matched_group)"
      - "Cùng IP nguồn (same_source_ip), trong vòng 240 giây (timeframe=240)"
      - "Bản thân alert 40112 là bản ghi của lần THÀNH CÔNG: user, phương thức, timestamp trong alert là của lần đăng nhập đó"
      - "Lần thử lẻ (5716/5760) KHÔNG đủ để kích hoạt; phải có alert tổng hợp trước. Thành công sau 240 giây chỉ ra 5715, không ra 40112"
    facts:
      - data.srcip                       # IP đăng nhập thành công
      - agent.id                         # khóa truy vấn Indexer
      - agent.name, agent.ip
      - timestamp                        # = t_success
      - "data.dstuser / data.srcuser: tài khoản ĐÃ vào được (chuỗi do kẻ tấn công kiểm soát → chỉ trích dẫn)"
      - "full_log: phương thức (Accepted password / publickey / keyboard-interactive) và dịch vụ"
    window:
      t0: "timestamp của alert brute force tổng hợp đầu tiên từ data.srcip (tìm bằng V0, lùi tối đa 24 giờ trước t_success)"
      t_success: "timestamp của alert 40112"
      end: "thời điểm điều tra (now): hoạt động sau đăng nhập là phần quan trọng nhất"
      note: "Truy vấn viết bằng DQL (Wazuh Dashboard → Discover, index wazuh-alerts-*). <user> = data.dstuser hoặc data.srcuser trong alert"
    verify:
      - id: V0
        question: "Chuỗi brute force đứng trước là loại nào (tìm 5712, 5720, 5733, 5763, 5551, 40111)?"
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:(5712 or 5720 or 5733 or 5763 or 5551 or 40111)'
        time_range: "t_success - 24h → t_success, sắp xếp timestamp tăng dần"
        interpret: >-
          Bản ghi đầu = t0. 5763/5720/5733 = đoán mật khẩu user CÓ THẬT → thành công có thể là
          đoán trúng. Chỉ có 5712 (user không tồn tại) mà <user> là tài khoản thật → hoặc kẻ tấn
          công đã chuyển sang wordlist khác, hoặc kẻ dò và người đăng nhập là hai người khác nhau
          dùng chung IP (NAT/bastion).

      - id: V1
        question: "Tài khoản vào được có bị thử sai mật khẩu trước đó không (tìm 5760, 5716 cùng user)?"
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:(5760 or 5716) and (data.dstuser:"<user>" or data.srcuser:"<user>")'
        time_range: "t0 → t_success"
        interpret: >-
          Có nhiều lần sai với ĐÚNG tài khoản đó rồi thành công → gần như chắc chắn mật khẩu bị đoán
          trúng. Không có lần sai nào với tài khoản đó → thành công không đến từ việc đoán: hoặc người
          hợp lệ dùng chung IP, hoặc kẻ tấn công đã có mật khẩu/khóa từ nguồn khác (credential stuffing).
          Tên field user cần xác nhận trên lab, nên truy vấn cả hai.

      - id: V2
        question: "Đăng nhập bằng mật khẩu hay bằng khóa (đọc full_log của 5715)?"
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:5715'
        time_range: "t_success - 5m → t_success + 5m"
        interpret: >-
          "Accepted password" → khớp kịch bản đoán mật khẩu. "Accepted publickey" → brute force mật
          khẩu không tạo ra được khóa riêng: hoặc là người hợp lệ, hoặc khóa của kẻ tấn công đã được
          cài vào authorized_keys TỪ TRƯỚC (kiểm V3 và FIM 550/554 trước t_success).

      - id: V3
        question: "Sau t_success, agent có sudo (5402, 5403), tạo user (5902, 2961) hay đổi file (550, 553, 554) không?"
        query: 'agent.id:"<agent_id>" and rule.id:(5402 or 5403 or 5404 or 5901 or 5902 or 2961 or 550 or 553 or 554 or 5501 or 5502) and timestamp >= "<alert_time>"'
        time_range: "t_success → now (nếu đăng nhập bằng publickey, xem thêm FIM từ t0 → t_success)"
        interpret: >-
          Dựng timeline. Chú ý file nhạy cảm trong syscheck.path: /etc/passwd, /etc/shadow,
          /etc/sudoers*, ~/.ssh/authorized_keys, /etc/cron*. 5501/5502 (PAM session opened/closed)
          không mang srcip: tương quan theo agent.id + user + thời gian; có 5501 mà chưa có 5502
          tương ứng → phiên có thể vẫn đang mở.

      - id: V4
        question: "Cùng srcip có đăng nhập thành công vào agent khác không (tìm 5715, 40112 trên mọi agent.id)?"
        query: 'data.srcip:"<srcip>" and rule.id:(5715 or 40112) and timestamp >= "<t0>"'
        time_range: "t0 → now, KHÔNG lọc agent.id"
        interpret: "Nhiều agent → cùng credential dùng lại trên nhiều máy (password reuse) hoặc di chuyển ngang; mở rộng phạm vi sự cố."

      - id: V5
        question: "srcip là nội bộ (RFC1918) hay công cộng, có thuộc danh sách được phép, có phải là một agent không (agent.ip)?"
        query: 'agent.ip:"<srcip>"'
        time_range: "now - 24h → now"
        interpret: >-
          Nội bộ = 10/8, 172.16/12, 192.168/16. Đối chiếu danh sách bastion/VPN/máy quét có ticket.
          Nếu srcip là một agent → máy nguồn có thể đã bị chiếm trước đó; điều tra cả agent đó.

    branches:                            # xét theo thứ tự, nhánh đầu tiên khớp được áp dụng
      - id: B1_active_intrusion
        when: "V3 có sudo/tạo user/đổi file nhạy cảm sau t_success, và srcip không thuộc danh sách được phép"
        severity: critical
        actions:
          - "Escalate ngay (L2/IR); ghi tài khoản, t_success, chuỗi hành động từ V3"
          - "Đề xuất (cần người phê duyệt): thu thập dữ liệu dễ mất (who/w, last, ss -tnp, ps) TRƯỚC, rồi cô lập agent"
          - "Đề xuất: khóa đúng tài khoản trong alert, kết thúc phiên đang mở, gỡ khóa SSH/user/cron lạ tìm thấy ở V3"
          - "Chạy V4 trên mọi agent: cùng credential có được dùng ở máy khác không"
      - id: B2_password_guessed
        when: "V1 có lần sai với đúng tài khoản đó, V2 là Accepted password, srcip không được phép"
        severity: critical
        actions:
          - "Coi mật khẩu tài khoản đó là đã lộ dù V3 chưa thấy hành động (log có thể chưa kịp về hoặc kẻ tấn công chưa hành động)"
          - "Đề xuất (cần người phê duyệt): đổi mật khẩu đúng tài khoản đó, kết thúc phiên, chặn srcip"
          - "Theo dõi tiếp V3 trong 24 giờ; chạy V4"
      - id: B3_key_or_unexplained
        when: "V2 là Accepted publickey, hoặc V1 không có lần sai nào với tài khoản đó"
        severity: high
        actions:
          - "Xác minh với chủ tài khoản: có đăng nhập vào t_success từ srcip đó không"
          - "Nếu publickey: kiểm FIM 550/554 trên ~/.ssh/authorized_keys TRƯỚC t_success (khóa cài từ trước)"
          - "Nếu chủ tài khoản không xác nhận → chuyển B2/B1"
      - id: B4_authorized
        when: "srcip thuộc danh sách được phép (bastion/VPN/máy quét có ticket) VÀ chủ tài khoản xác nhận đăng nhập"
        severity: low
        actions:
          - "Đóng, ghi người xác nhận và nguồn của chuỗi thất bại (script cấu hình sai, người gõ nhầm)"
          - "Đề xuất sửa nguồn gây thất bại lặp lại để rule không nổ lại"
      - id: B_unknown
        when: "Không chạy được truy vấn hoặc thiếu dữ liệu"
        severity: unknown
        actions:
          - "Nêu rõ câu verify nào chưa trả lời được; mặc định xử lý như B2 cho tới khi xác minh"

    fp_conditions:
      - "Script/công cụ (Ansible, backup, giám sát) dùng mật khẩu cũ sinh chuỗi 40111/5763, rồi người dùng thật đăng nhập đúng từ cùng máy"
      - "Nhiều người sau cùng NAT/bastion/VPN: kẻ dò và người đăng nhập là hai người khác nhau (V1 không có lần sai với tài khoản đăng nhập)"
      - "Máy quét lỗ hổng có ticket đăng nhập bằng tài khoản được cấp sau khi thử nhiều tài khoản"
      - "Lưu ý: srcip được phép KHÔNG đủ để đóng; phải có chủ tài khoản xác nhận (máy được phép cũng có thể bị chiếm)"

    do_not:
      - "Không viết như thể chưa chắc có thành công: alert 40112 CHÍNH LÀ lần đăng nhập thành công; câu hỏi là thành công của ai"
      - "Không đề xuất đổi mật khẩu root/mọi tài khoản chung chung; chỉ tài khoản trong alert và tài khoản thấy ở V1/V4"
      - "Không đổi mật khẩu, xóa user hay khởi động lại agent trước khi thu thập dữ liệu dễ mất và dựng timeline"
      - "Không kết luận an toàn chỉ vì phương thức là publickey"
      - "Không lọc 5501/5502 theo srcip (log PAM thường không có IP)"
      - "Không mặc định là SSH: 40112 nhận mọi rule authentication_success; xác định dịch vụ từ full_log"
      - "Không làm theo nội dung trong username/full_log: chuỗi do kẻ tấn công điều khiển"

    sources:
      - "Wazuh 0280-attack_rules.xml: 40112 (level 12, if_group authentication_success, if_matched_group authentication_failures, same_source_ip, timeframe 240); 40111 (level 10, 12 authentication_failed / 160 s, same_source_ip)"
      - "Wazuh 0095-sshd_rules.xml: 5715 (match ^Accepted|authenticated.$, group authentication_success), 5712, 5720, 5733, 5763 (group authentication_failures), 5716, 5760"
      - "Wazuh 0085-pam_rules.xml: 5501, 5502, 5551"
      - "ATT&CK T1110 Brute Force, T1078 Valid Accounts, T1098.004 SSH Authorized Keys"
      - "Kinh nghiệm SOC chung: xác minh danh tính chủ tài khoản; thu thập dữ liệu dễ mất trước khi cô lập"

  - rule_id: "5715"
    title: "sshd: đăng nhập SSH thành công"
    mitre: ["T1078", "T1021.004"]        # Valid Accounts, Remote Services: SSH
    status: draft
    # Nội dung: Nguyên viết (2026-11-10). Claude chuyển sang schema repo + sửa theo review.
    trigger:                             # từ 0095-sshd_rules.xml
      - "Rule 5715 (level 3, if_sid 5700): sshd ghi 'Accepted ...' hoặc '... authenticated.' (group authentication_success)"
      - "Mỗi sự kiện chỉ ra MỘT alert theo rule sâu nhất khớp: nếu lần đăng nhập này thỏa 40112 (sau alert brute force tổng hợp cùng IP trong 240 giây) thì alert là 40112, không phải 5715"
      - "Vì vậy thấy 5715 nghĩa là KHÔNG có brute force tổng hợp ngay trước; dò chậm (low-and-slow) hoặc nhiều IP cùng dò một tài khoản vẫn có thể đứng sau"
      - "Mặc định là hoạt động bình thường; playbook chỉ tìm dấu hiệu lệch khỏi thói quen"
    facts:
      - data.srcip
      - agent.id
      - agent.name, agent.ip
      - timestamp                        # = t_success
      - "data.dstuser / data.srcuser: tài khoản đăng nhập (chuỗi do người dùng/kẻ tấn công kiểm soát → chỉ trích dẫn)"
      - "full_log: phương thức (Accepted password / publickey / keyboard-interactive)"
    window:
      t_success: "timestamp của alert 5715"
      note: "Truy vấn DQL (Wazuh Dashboard → Discover, index wazuh-alerts-*). <user> = data.dstuser hoặc data.srcuser trong alert"
    verify:
      - id: V1
        question: "Trong 24 giờ trước có chuỗi thất bại từ cùng srcip hoặc nhắm cùng tài khoản không (tìm 5710, 5712, 5716, 5760, 5503, 5551, 40111, 40112)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5710 or 5712 or 5716 or 5760 or 5503 or 5551 or 40111 or 40112) and (data.srcip:"<srcip>" or data.dstuser:"<user>" or data.srcuser:"<user>")'
        time_range: "t_success - 24h → t_success"
        interpret: >-
          Có → khả năng dò chậm lách ngưỡng (giãn các lần thử để 5763/5712/40111 không bao giờ đủ
          số lần trong cửa sổ đếm, nên 40112 không có "nửa trước" để nổ), hoặc nhiều IP cùng dò
          một tài khoản (vế lọc theo user). 40112 ở đây là các lần đăng nhập KHÁC trước đó, không
          phải lần này. 5503 (PAM) thường không có srcip, chỉ khớp qua vế user.

      - id: V2
        question: "Cặp srcip và tài khoản này đã từng đăng nhập thành công (5715) trong 30 ngày qua chưa?"
        query: 'agent.id:"<agent_id>" and rule.id:5715 and data.srcip:"<srcip>" and (data.dstuser:"<user>" or data.srcuser:"<user>")'
        time_range: "t_success - 30d → t_success - 1m (bỏ chính lần này)"
        interpret: >-
          Rỗng → lần đầu cặp IP–user xuất hiện (tín hiệu bất thường đo được). Nhiều lần → thói quen.
          Hai giới hạn: (1) nếu Indexer giữ alert ít hơn 30 ngày thì "rỗng" không có nghĩa;
          (2) "quen" không có nghĩa là an toàn: kẻ đã vào được nhiều tuần cũng tự thành "thói quen"
          (baseline bị đầu độc), nên với root/tài khoản dịch vụ không dùng V2 để đóng.

      - id: V3
        question: "Tài khoản và phương thức trong alert 5715 là gì: root hay tài khoản dịch vụ, password hay publickey, có ngoài giờ không?"
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:5715'
        time_range: "t_success ± 1m (đọc full_log của chính lần đăng nhập)"
        interpret: >-
          Đáng nghi: root đăng nhập trực tiếp; tài khoản dịch vụ (www-data, postgres, nginx...) vốn
          có shell nologin, đăng nhập được nghĩa là shell đã bị đổi; password trên máy quy định chỉ
          dùng khóa; ngoài giờ không có change ticket. Kiểm thủ công: danh sách nhân sự (HR), lịch
          bảo trì — Wazuh không biết các thông tin này.

      - id: V4
        question: "Chỉ khi có chuỗi thất bại trước đó, cặp IP–tài khoản lần đầu xuất hiện, hoặc tài khoản/phương thức bất thường: sau t_success có sudo (5402, 5403), tạo user (5901, 5902, 2961) hay đổi file nhạy cảm (550, 553, 554) không?"
        query: 'agent.id:"<agent_id>" and rule.id:(5402 or 5403 or 5901 or 5902 or 2961 or 550 or 553 or 554 or 5501 or 5502) and timestamp >= "<alert_time>"'
        time_range: "t_success → now"
        interpret: >-
          Chú ý syscheck.path: ~/.ssh/authorized_keys, /etc/passwd, /etc/shadow, /etc/sudoers*,
          /etc/cron*. 5501/5502 (PAM session) không có srcip: tương quan theo agent.id + user + thời gian.

    branches:                            # xét theo thứ tự, nhánh đầu tiên khớp được áp dụng
      - id: B1_slow_bruteforce
        when: "V1 có chuỗi thất bại trước đó, hoặc V4 thấy sudo/tạo user/sửa file nhạy cảm"
        severity: high
        actions:
          - "Xử lý như 40112: chạy V4 nếu chưa chạy; kiểm lan ngang (rule 5715, 40112 từ cùng srcip trên mọi agent.id)"
          - "Xác minh khẩn với chủ tài khoản về phiên lúc t_success từ srcip"
          - "Đề xuất (cần người phê duyệt): kết thúc phiên SSH, đổi mật khẩu đúng tài khoản đó, chặn srcip nếu chủ tài khoản không xác nhận"
      - id: B2_sensitive_account
        when: "V3 là root đăng nhập trực tiếp hoặc tài khoản dịch vụ, BẤT KỂ V2"
        severity: medium
        actions:
          - "Chạy V4; với tài khoản dịch vụ kiểm shell trong /etc/passwd và FIM 550 trên /etc/passwd"
          - "Xác minh với quản trị viên hệ thống; nếu không ai nhận → nâng B1"
      - id: B3_first_seen_anomalous
        when: "V1 sạch, V2 rỗng (lần đầu cặp IP–user), KÈM bất thường ở V3 (password thay vì khóa, ngoài giờ không có change ticket)"
        severity: medium
        actions:
          - "Chạy V4; liên hệ chủ tài khoản về phiên lúc t_success từ srcip"
      - id: B4_first_seen_normal
        when: "V1 sạch, V2 rỗng, V3 bình thường (tài khoản cá nhân, publickey, trong giờ)"
        severity: low
        actions:
          - "Ghi chú 'IP mới cho tài khoản này', không chạy V4, không liên hệ người dùng"
          - "Nếu cùng IP mới xuất hiện cho nhiều tài khoản khác nhau trong ngày → chuyển B3"
      - id: B5_routine
        when: "V1 sạch, V2 có lịch sử quen thuộc, V3 đúng tài khoản/phương thức/khung giờ"
        severity: low
        actions:
          - "Đóng như hoạt động hợp lệ, không chạy V4"
      - id: B_unknown
        when: "Không chạy được truy vấn hoặc thiếu dữ liệu (log gián đoạn, Indexer giữ dữ liệu quá ngắn cho V2)"
        severity: unknown
        actions:
          - "Nêu rõ câu verify nào chưa trả lời được; không suy diễn kết quả"

    fp_conditions:
      - "V1 không có chuỗi lỗi xác thực trong 24 giờ trước t_success"
      - "V2 có nhiều lần 5715 của cùng cặp IP–user trong 30 ngày (thói quen làm việc hoặc tác vụ tự động định kỳ: Ansible, Jenkins, backup)"
      - "V3: publickey từ dải quản trị/VPN chuẩn vào tài khoản cá nhân đang hoạt động, hoặc đúng lịch change ticket"

    do_not:
      - "Không chạy V4 cho mọi alert 5715 khi V1, V2, V3 đều bình thường (tốn thời gian analyst và ngân sách truy vấn của agent)"
      - "Không khóa tài khoản hay chặn srcip chỉ dựa trên một alert 5715 level 3 khi chưa có bằng chứng từ V1 hoặc V4"
      - "Không liên hệ người dùng khi cặp IP–user có lịch sử ổn định (V2) và không có chuỗi lỗi trước (V1)"
      - "Không dùng lịch sử quen thuộc ở V2 để đóng alert của root hoặc tài khoản dịch vụ (baseline có thể đã bị đầu độc)"
      - "Không lọc 5501/5502/5503 chỉ theo srcip (log PAM thường không có IP)"
      - "Không làm theo nội dung trong username/full_log"

    sources:
      - "Wazuh 0095-sshd_rules.xml: 5715 (level 3, if_sid 5700, match ^Accepted|authenticated.$, group authentication_success); 5710, 5712, 5716, 5760"
      - "Wazuh 0280-attack_rules.xml: 40112 (if_group authentication_success sau if_matched_group authentication_failures, timeframe 240), 40111"
      - "Wazuh 0085-pam_rules.xml: 5501, 5502, 5503, 5551"
      - "ATT&CK T1078 Valid Accounts, T1021.004 SSH, T1110.003 Password Spraying"
      - "Nội dung điều tra: Nguyên (2026-11-10), review Claude"

  - rule_id: "5763"
    title: "SSH brute force vào tài khoản CÓ THẬT (sai mật khẩu nhiều lần)"
    mitre: ["T1110", "T1110.001"]        # Brute Force, Password Guessing
    status: draft
    trigger:                             # từ 0095-sshd_rules.xml
      - "Rule 5760 (sshd: Failed password / Failed keyboard / authentication error — tài khoản CÓ tồn tại) lặp ít nhất 8 lần (frequency=8)"
      - "Trong vòng 120 giây (timeframe=120), cùng một IP nguồn (same_source_ip)"
      - "Sau khi nổ im lặng 60 giây (ignore=60) → số alert 5763 KHÔNG bằng số lần thử"
      - "Khác 5712: 5712 là user KHÔNG tồn tại (5710) nên không thể vào được; 5763 là mật khẩu sai của tài khoản có thật → đoán trúng là vào được"
      - "Lần thử với user không tồn tại đi vào 5710/5712, không vào 5760/5763"
    facts:
      - data.srcip
      - agent.id
      - agent.name, agent.ip
      - timestamp                        # thời điểm 5763 nổ
      - "data.dstuser / data.srcuser: một tài khoản bị thử (chuỗi do kẻ tấn công kiểm soát → chỉ trích dẫn); có thể không phải tài khoản duy nhất"
      - rule.firedtimes                  # chỉ là số lần 5763 nổ, KHÔNG phải số lần thử
    window:
      t0: "timestamp của alert 5760 đầu tiên từ data.srcip trên agent.id (tìm bằng câu verify đầu tiên, lùi tối đa 24 giờ)"
      end: "thời điểm điều tra (now): thành công có thể đến sau khi 5763 im lặng"
      note: "Truy vấn DQL (Wazuh Dashboard → Discover, index wazuh-alerts-*)"
    verify:
      - id: V0
        question: "Chuỗi đoán mật khẩu bắt đầu từ khi nào (t0 = alert 5760 đầu tiên)?"
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:5760'
        time_range: "24 giờ trước thời điểm alert, sắp xếp timestamp tăng dần, lấy bản ghi đầu"
        interpret: "Bản ghi đầu = t0. Các truy vấn sau dùng khoảng t0 → now."

      - id: V1
        question: "Cùng srcip đã đăng nhập SSH thành công chưa (tìm 5715, 40112)? Câu quan trọng nhất."
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:(5715 or 40112)'
        time_range: "t0 → now"
        interpret: >-
          Có → ghi tài khoản, thời điểm (t_success) và phương thức trong full_log. Thành công trong
          240 giây sau một 5763 thường ra 40112; thành công muộn hơn chỉ ra 5715, nên luôn tìm cả hai.
          Đặc biệt nguy hiểm khi tài khoản thành công TRÙNG tài khoản bị thử sai.

      - id: V2
        question: "Những tài khoản nào bị thử, mỗi tài khoản bao nhiêu lần (đếm 5760, 5716 theo user)?"
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:(5760 or 5716)'
        time_range: "t0 → now; Visualize đếm theo data.dstuser và data.srcuser"
        interpret: >-
          1–2 tài khoản, nhiều lần mỗi tài khoản → đoán mật khẩu có chủ đích (thường root/admin, tên
          lấy từ đâu đó). Nhiều tài khoản, ít lần mỗi tài khoản → password spraying (một mật khẩu phổ
          biến thử trên nhiều tài khoản để né khóa tài khoản). Ghi danh sách tài khoản: đây là các
          tài khoản cần theo dõi/đổi mật khẩu nếu có thành công.

      - id: V3
        question: "Cùng srcip có nhắm các agent khác không (tìm 5760, 5763, 5715 trên mọi agent.id)?"
        query: 'data.srcip:"<srcip>" and rule.id:(5760 or 5763 or 5715)'
        time_range: "t0 → now, KHÔNG lọc agent.id"
        interpret: "Nhiều agent → chiến dịch rộng; chạy lại câu hỏi đăng nhập thành công trên từng agent có 5715."

      - id: V4
        question: "srcip là nội bộ (RFC1918) hay công cộng, có thuộc danh sách được phép, có phải là một agent không (agent.ip)?"
        query: 'agent.ip:"<srcip>"'
        time_range: "24 giờ gần nhất"
        interpret: >-
          Nội bộ = 10/8, 172.16/12, 192.168/16. Nếu srcip là một agent → máy nguồn có thể đã bị chiếm và
          đang dò ngang (T1021.004). Công cộng → tra danh tiếng IP; không có thì ghi "chưa tra".

      - id: V5
        question: "Chỉ khi đã có đăng nhập thành công: sau đó agent có sudo (5402, 5403), tạo user (5902, 2961) hay đổi file (550, 553, 554) không?"
        query: 'agent.id:"<agent_id>" and rule.id:(5402 or 5403 or 5404 or 5901 or 5902 or 2961 or 550 or 553 or 554) and timestamp >= "<t_success>"'
        time_range: "từ lần đăng nhập thành công đến now"
        interpret: >-
          <t_success> là thời điểm 5715/40112 tìm được ở câu hỏi đăng nhập thành công (KHÔNG phải thời điểm
          alert 5763). Chú ý syscheck.path: ~/.ssh/authorized_keys, /etc/passwd, /etc/shadow, /etc/sudoers*, /etc/cron*.

    branches:
      - id: B1_compromise
        when: "V1 có 5715/40112 từ srcip, và srcip không thuộc danh sách được phép có ticket"
        severity: critical
        actions:
          - "Escalate ngay; ghi tài khoản đã vào, thời điểm, phương thức; chạy V5 dựng timeline"
          - "Đề xuất (cần người phê duyệt): thu thập dữ liệu dễ mất (who/w, last, ss -tnp, ps) TRƯỚC, rồi cô lập agent"
          - "Đề xuất: đổi mật khẩu đúng tài khoản đã vào, kết thúc phiên, kiểm khóa SSH lạ"
          - "Chạy V3: tài khoản đó có vào được agent khác không (dùng lại mật khẩu)"
      - id: B2_privileged_target
        when: "V1 rỗng; V2 cho thấy tài khoản đặc quyền (root, admin, tài khoản sudo) bị thử nhiều lần"
        severity: high
        actions:
          - "Theo dõi tiếp 5715/40112 từ srcip trong 24 giờ"
          - "Đề xuất (cần người phê duyệt): chặn srcip; khuyến nghị PermitRootLogin no, tắt PasswordAuthentication, chỉ dùng khóa"
          - "Kiểm mật khẩu tài khoản bị nhắm có yếu/mặc định không (theo quy trình nội bộ)"
      - id: B3_internal_source
        when: "V1 rỗng; srcip nội bộ không thuộc danh sách được phép"
        severity: high
        actions:
          - "Coi máy nguồn là nghi bị chiếm (dò SSH nội bộ = dấu hiệu di chuyển ngang)"
          - "Nếu V4 cho thấy srcip là agent: mở điều tra trên agent đó"
          - "Không chặn IP nội bộ khi chưa xác định máy đó là gì"
      - id: B4_external_no_success
        when: "V1 rỗng; srcip công cộng; tài khoản bị thử không phải đặc quyền"
        severity: medium
        actions:
          - "Ghi nhận brute force thất bại từ Internet; đề xuất chặn/giới hạn tốc độ srcip (firewall, fail2ban, active response)"
          - "Kiểm vì sao SSH của agent mở ra Internet; khuyến nghị VPN/bastion"
      - id: B5_authorized
        when: "srcip thuộc danh sách được phép (máy quét/script) có ticket hoặc người chịu trách nhiệm xác nhận"
        severity: low
        actions:
          - "Đóng, ghi ticket; đề xuất sửa script dùng mật khẩu cũ"
          - "Nếu V1 có 5715 với tài khoản ngoài phạm vi ticket → quay lại B1"
      - id: B_unknown
        when: "Không chạy được truy vấn hoặc thiếu dữ liệu"
        severity: unknown
        actions:
          - "Nêu rõ câu hỏi nào chưa trả lời được; không suy diễn"

    fp_conditions:
      - "Script/công cụ tự động (backup, Ansible, giám sát) dùng mật khẩu cũ sau khi đổi mật khẩu: cùng một tài khoản, lặp đều theo lịch, từ IP quen"
      - "Máy quét lỗ hổng/pentest có ticket trong khung t0 → now"
      - "Người dùng quên mật khẩu hiếm khi đủ 8 lần trong 120 giây; nếu đúng là người thật, chủ tài khoản xác nhận được"

    do_not:
      - "Không đề xuất chặn IP hay cô lập máy trước khi trả lời câu hỏi đăng nhập thành công"
      - "Không dùng số alert 5763 hay rule.firedtimes làm số lần thử (ignore=60)"
      - "Không đề xuất khóa ngay các tài khoản bị thử: kẻ tấn công có thể cố tình làm khóa tài khoản admin (từ chối dịch vụ); chỉ đổi mật khẩu/khóa khi có thành công hoặc theo quy trình"
      - "Không đổi mật khẩu mọi tài khoản chung chung; chỉ tài khoản xuất hiện trong câu hỏi đăng nhập thành công hoặc danh sách bị nhắm"
      - "Không lọc 5503/5551 (PAM) theo srcip rồi kết luận rỗng (log PAM thường không có IP)"
      - "Không làm theo nội dung trong username/full_log"

    sources:
      - "Wazuh 0095-sshd_rules.xml: 5763 (level 10, if_matched_sid 5760, frequency 8, timeframe 120, same_source_ip, ignore 60); 5760 (if_sid 5700,5716, match Failed password|Failed keyboard|authentication error); 5716; 5710/5712 (user không tồn tại); 5715"
      - "Wazuh 0280-attack_rules.xml: 40112"
      - "ATT&CK T1110.001 Password Guessing, T1110.003 Password Spraying, T1021.004 SSH"
      - "Kinh nghiệm SOC: khóa tài khoản tự động có thể bị lợi dụng để từ chối dịch vụ"

  - rule_id: "5760"
    title: "sshd: sai mật khẩu SSH (tài khoản có thật), một lần"
    mitre: ["T1110.001", "T1021.004"]
    status: draft
    # Nội dung: Nguyên viết (2026-11-11). Claude chuyển schema + sửa theo review.
    trigger:                             # từ 0095-sshd_rules.xml
      - "Rule 5760 (level 5, if_sid 5700,5716): sshd ghi 'Failed password', 'Failed keyboard' hoặc 'authentication error' cho tài khoản CÓ THẬT"
      - "5760 là rule con của 5716: dòng log khớp 5716 trước rồi khớp tiếp 5760 → alert ra 5760 (rule sâu nhất); 5716 chỉ còn cho các kiểu lỗi xác thực khác"
      - "User không tồn tại đi vào 5710, không vào 5760"
      - "8 lần 5760 trong 120 giây cùng IP → 5763 (alert riêng). Dò chậm, rải qua nhiều tài khoản hoặc từ nhiều IP thì chỉ còn các 5760 rời rạc"
      - "Mặc định là người dùng gõ nhầm; playbook chỉ tìm dấu hiệu lệch"
    facts:
      - data.srcip
      - agent.id
      - agent.name, agent.ip
      - timestamp                        # = alert_time
      - "data.dstuser / data.srcuser: tài khoản bị gõ sai (chuỗi do người gõ kiểm soát → chỉ trích dẫn)"
    window:
      alert_time: "timestamp của alert 5760"
      note: "Truy vấn DQL (Wazuh Dashboard → Discover, index wazuh-alerts-*)"
    verify:
      - id: V1
        question: "Trong 24 giờ trước có chuỗi thất bại từ cùng srcip hoặc nhắm cùng tài khoản không (tìm 5710, 5712, 5716, 5760, 5763, 5503, 5551, 40111)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5710 or 5712 or 5716 or 5760 or 5763 or 5503 or 5551 or 40111) and (data.srcip:"<srcip>" or data.dstuser:"<user>" or data.srcuser:"<user>")'
        time_range: "24 giờ trước thời điểm alert → thời điểm alert"
        interpret: >-
          1–3 lần cùng cặp IP–tài khoản → gõ nhầm. Nhiều lần rải rác → dò chậm. Một IP, nhiều tài khoản
          khác nhau → password spraying. Nhiều IP, cùng một tài khoản → dò phân tán. Đếm theo user
          và theo srcip để phân biệt. 5503/5551 (PAM) thường không có srcip, chỉ khớp qua vế user.

      - id: V2
        question: "Sau lần sai mật khẩu, cùng IP hoặc cùng tài khoản có đăng nhập thành công không (tìm 5715, 40112)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5715 or 40112) and (data.srcip:"<srcip>" or data.dstuser:"<user>" or data.srcuser:"<user>") and timestamp >= "<alert_time>"'
        time_range: "thời điểm alert → now"
        interpret: >-
          Có → ghi tài khoản, thời điểm (t_success), phương thức. Vài lần sai rồi thành công từ một cặp
          IP–tài khoản CHƯA từng thấy (xem câu tiếp theo) → nghi credential stuffing (mật khẩu lộ ở nơi
          khác), dù không có chuỗi dài.

      - id: V3
        question: "Cặp srcip và tài khoản đã từng đăng nhập thành công (5715) trong 30 ngày chưa, và tài khoản có phải root hay tài khoản dịch vụ không?"
        query: 'agent.id:"<agent_id>" and rule.id:5715 and data.srcip:"<srcip>" and (data.dstuser:"<user>" or data.srcuser:"<user>")'
        time_range: "30 ngày trước thời điểm alert"
        interpret: >-
          Rỗng → lần đầu cặp này xuất hiện. Loại tài khoản đọc thẳng từ alert: root, www-data, postgres,
          nginx, mysql không có người gõ mật khẩu SSH → đáng nghi bất kể lịch sử. Giới hạn: Indexer giữ
          dữ liệu ít hơn 30 ngày thì "rỗng" không có nghĩa; lịch sử quen không chứng minh an toàn.

      - id: V4
        question: "Chỉ khi đã có đăng nhập thành công đáng nghi: sau đó agent có sudo (5402, 5403), tạo user (5901, 5902, 2961) hay đổi file nhạy cảm (550, 553, 554) không?"
        query: 'agent.id:"<agent_id>" and rule.id:(5402 or 5403 or 5901 or 5902 or 2961 or 550 or 553 or 554 or 5501 or 5502) and timestamp >= "<t_success>"'
        time_range: "từ lần đăng nhập thành công đến now"
        interpret: >-
          <t_success> lấy từ kết quả câu hỏi đăng nhập thành công, không phải giờ alert 5760. Chú ý
          ~/.ssh/authorized_keys, /etc/passwd, /etc/sudoers*. 5501/5502 không có srcip.

    branches:
      - id: B1_post_login_activity
        when: "V4 có sudo/tạo user/sửa file nhạy cảm sau một đăng nhập thành công đáng nghi"
        severity: critical
        actions:
          - "Escalate ngay; dựng timeline từ lần sai mật khẩu đầu tiên đến hành động sau đăng nhập"
          - "Đề xuất (cần người phê duyệt): thu thập dữ liệu dễ mất rồi cô lập agent; đổi mật khẩu đúng tài khoản đã vào"
      - id: B2_suspicious_success
        when: "V2 có đăng nhập thành công, KÈM ít nhất một: V1 có chuỗi thất bại, V3 cặp IP–tài khoản lần đầu, hoặc tài khoản root/dịch vụ"
        severity: high
        actions:
          - "Chạy V4; kiểm cùng srcip có đăng nhập agent khác (5715 trên mọi agent.id)"
          - "Xác minh khẩn với chủ tài khoản về lần đăng nhập đó"
          - "Đề xuất (cần người phê duyệt): kết thúc phiên, đổi mật khẩu tài khoản đó, chặn srcip nếu chủ tài khoản không xác nhận"
      - id: B3_guessing_no_success
        when: "V2 rỗng, nhưng V1 có chuỗi dò (chậm, spraying, phân tán), hoặc tài khoản là root/dịch vụ, hoặc nguồn là máy nội bộ không có vai trò quản trị"
        severity: medium
        actions:
          - "Ghi nhận dò mật khẩu; IP công cộng → đề xuất chặn/giới hạn tốc độ; máy nội bộ → kiểm máy nguồn có bị chiếm hoặc chạy script sai mật khẩu"
          - "Theo dõi 5715/40112 cho tài khoản bị nhắm trong 24 giờ"
      - id: B4_new_source_benign
        when: "V1 sạch, V3 cặp IP–tài khoản lần đầu, tài khoản cá nhân thường, V2 không có thành công đáng nghi"
        severity: low
        actions:
          - "Ghi chú 'IP mới cho tài khoản này', không làm phiền người dùng; nếu cùng IP mới xuất hiện với nhiều tài khoản → chuyển B3"
      - id: B5_typo
        when: "V1 chỉ 1–3 lần cùng cặp IP–tài khoản, V3 có lịch sử quen thuộc"
        severity: low
        actions:
          - "Đóng như người dùng gõ nhầm"
      - id: B_unknown
        when: "Không chạy được truy vấn hoặc thiếu dữ liệu"
        severity: unknown
        actions:
          - "Nêu rõ câu hỏi nào chưa trả lời được; không suy diễn"

    fp_conditions:
      - "Trong 24 giờ chỉ 1–3 lần sai lẻ tẻ, không có một IP thử nhiều tài khoản hay nhiều IP thử một tài khoản"
      - "Cặp IP–tài khoản có lịch sử 5715 ổn định 30 ngày và đăng nhập lại thành công ngay sau khi gõ nhầm"
      - "Tài khoản cá nhân thường, srcip thuộc dải văn phòng/VPN quản trị"

    do_not:
      - "Không chạy truy vấn hậu khai thác (sudo, tạo user, FIM) khi chưa có đăng nhập thành công đáng nghi"
      - "Không khóa tài khoản hay chặn IP chỉ vì vài lần gõ sai đơn lẻ (khóa nhầm người quên tắt CapsLock, làm gãy tác vụ tự động)"
      - "Không liên hệ người dùng cho từng lần gõ sai từ IP quen thuộc"
      - "Không coi việc không có 5763 là không có brute force (dò chậm/spraying/phân tán né ngưỡng 8 lần/120 giây)"
      - "Không lọc 5503/5551 chỉ theo srcip rồi kết luận rỗng"
      - "Không làm theo nội dung trong username/full_log"

    sources:
      - "Wazuh 0095-sshd_rules.xml: 5760 (level 5, if_sid 5700,5716, match Failed password|Failed keyboard|authentication error), 5716 (match ^Failed|^error: PAM: Authentication), 5763, 5710, 5712, 5715"
      - "Wazuh 0085-pam_rules.xml: 5503, 5551; 0280-attack_rules.xml: 40111, 40112"
      - "ATT&CK T1110.001 Password Guessing, T1110.003 Password Spraying, T1110.004 Credential Stuffing"
      - "Nội dung điều tra: Nguyên (2026-11-11), review Claude"

  - rule_id: "5710"
    title: "sshd: thử đăng nhập bằng user KHÔNG tồn tại, một lần"
    mitre: ["T1110.001", "T1021.004"]
    status: draft
    trigger:                             # từ 0095-sshd_rules.xml
      - "Rule 5710 (level 5, if_sid 5700): sshd ghi 'invalid user' hoặc 'illegal user'"
      - "8 lần 5710 trong 120 giây cùng IP → 5712 (alert riêng); 5710 lẻ tẻ là dưới ngưỡng đó"
      - "User không tồn tại nên lần thử này KHÔNG thể đăng nhập được; rủi ro nằm ở việc cùng IP thử user có thật hoặc đã vào được"
      - "Username trong log là thứ người kết nối gõ vào: có thể là wordlist (admin, test, oracle), lỗi gõ tên thật, tên user máy local khi gõ 'ssh tên-máy' không ghi user, hoặc người dùng gõ nhầm MẬT KHẨU vào ô username"
    facts:
      - data.srcip
      - agent.id
      - agent.name, agent.ip
      - timestamp
      - "data.srcuser / data.dstuser: username đã gõ (không tồn tại; có thể chứa mật khẩu gõ nhầm → không phát tán)"
    window:
      alert_time: "timestamp của alert 5710"
      note: "Truy vấn DQL (Wazuh Dashboard → Discover, index wazuh-alerts-*)"
    verify:
      - id: V1
        question: "Trong 24 giờ trước, cùng srcip có thử thêm user khác hoặc sai mật khẩu không (tìm 5710, 5712, 5758, 5760, 5763)?"
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:(5710 or 5712 or 5758 or 5760 or 5763)'
        time_range: "24 giờ trước thời điểm alert → thời điểm alert; đếm số username khác nhau"
        interpret: >-
          Nhiều username dạng wordlist (admin, test, ubuntu, oracle, git), rải rác → dò tên chậm né 5712.
          Có cả 5760/5763 → đã chuyển sang đoán mật khẩu user có thật. Chỉ 1–2 lần, username gần
          giống tên thật (sai một chữ) → gõ nhầm.

      - id: V2
        question: "Sau đó cùng srcip có đăng nhập thành công không (tìm 5715, 40112)?"
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:(5715 or 40112) and timestamp >= "<alert_time>"'
        time_range: "thời điểm alert → now"
        interpret: >-
          Có, và tài khoản thành công là tên đúng của username gõ nhầm → người dùng thật sửa lỗi gõ.
          Có, nhưng V1 cho thấy dò nhiều username → nghi đã tìm ra tài khoản và vào được.

      - id: V3
        question: "Cùng srcip đã từng đăng nhập thành công (5715) vào agent này trong 30 ngày chưa?"
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:5715'
        time_range: "30 ngày trước thời điểm alert"
        interpret: "Có lịch sử → IP quen (máy admin, bastion). Rỗng → nguồn lạ với agent này (vẫn phụ thuộc retention Indexer)."

      - id: V4
        question: "srcip là nội bộ (RFC1918) hay công cộng, có phải là một agent không (agent.ip)?"
        query: 'agent.ip:"<srcip>"'
        time_range: "24 giờ gần nhất"
        interpret: >-
          Máy nội bộ không có vai trò quản trị mà dò username SSH → dấu hiệu máy đó đã bị chiếm và
          đang dò ngang. IP công cộng một lần lẻ tẻ → nhiễu Internet thông thường.

    branches:
      - id: B1_found_and_entered
        when: "V1 cho thấy dò nhiều username hoặc có 5760/5763, VÀ V2 có đăng nhập thành công từ srcip"
        severity: high
        actions:
          - "Xử lý theo playbook 40112/5715: xác minh chủ tài khoản đã vào, kiểm hoạt động sau đăng nhập"
          - "Đề xuất (cần người phê duyệt): chặn srcip nếu chủ tài khoản không xác nhận"
      - id: B2_internal_scanner
        when: "V4: srcip là máy nội bộ không có vai trò quản trị, V3 không có lịch sử"
        severity: medium
        actions:
          - "Kiểm máy nguồn: có bị chiếm hay chạy công cụ quét không (nếu là agent, xem đăng nhập/tiến trình gần thời điểm alert)"
          - "Không chặn IP nội bộ khi chưa xác định máy đó là gì"
      - id: B3_slow_enumeration
        when: "V1 cho thấy nhiều username rải rác (dò chậm), V2 rỗng"
        severity: medium
        actions:
          - "Ghi nhận dò tên tài khoản dưới ngưỡng 5712; IP công cộng → đề xuất chặn/giới hạn tốc độ"
          - "Khuyến nghị cấu hình: AllowUsers, tắt PasswordAuthentication"
      - id: B4_password_in_username
        when: "Username trông giống một mật khẩu (người dùng gõ nhầm mật khẩu vào ô username), thường kèm V2 thành công với tên đúng ngay sau"
        severity: medium
        actions:
          - "Yêu cầu chủ tài khoản đổi mật khẩu ngay: mật khẩu đã nằm dạng rõ trong auth.log của agent VÀ trong Wazuh Indexer (ai xem được SIEM đều đọc được)"
          - "Báo người quản trị SIEM về việc lưu trữ/xử lý bản ghi chứa mật khẩu theo quy trình nội bộ; không chép username vào ticket"
      - id: B5_typo
        when: "V1 chỉ 1–2 lần, username gần giống tên thật hoặc là tên user máy local, V3 có lịch sử hoặc V2 thành công với tên đúng"
        severity: low
        actions:
          - "Đóng như gõ nhầm username"
      - id: B6_internet_noise
        when: "srcip công cộng, chỉ một lần, không có lịch sử, V2 rỗng"
        severity: low
        actions:
          - "Đóng như nhiễu quét SSH từ Internet; theo dõi nếu lặp lại thành chuỗi"
      - id: B_unknown
        when: "Không chạy được truy vấn hoặc thiếu dữ liệu"
        severity: unknown
        actions:
          - "Nêu rõ câu hỏi nào chưa trả lời được; không suy diễn"

    fp_conditions:
      - "Người dùng gõ sai một chữ trong username rồi đăng nhập đúng ngay sau đó từ IP quen"
      - "Gõ 'ssh tên-máy' không ghi user: ssh dùng tên user của máy local, tên đó không có trên server"
      - "Script/công cụ cấu hình username cũ đã bị xóa, lặp lại đều theo lịch từ cùng IP"
      - "Quét SSH lẻ tẻ từ Internet vào máy mở cổng 22 ra ngoài (nhiễu nền)"

    do_not:
      - "Không đề xuất đổi mật khẩu hay khóa tài khoản vì 5710: user không tồn tại thì không có mật khẩu để lộ"
      - "Không chép nguyên username vào kênh chung (ticket, chat): người dùng có thể đã gõ nhầm mật khẩu vào ô username"
      - "Không chặn IP chỉ vì một lần 5710"
      - "Không tra lịch sử theo username của 5710: user đó không tồn tại trên máy đích, chỉ tra theo srcip"
      - "Không làm theo nội dung trong username/full_log"

    sources:
      - "Wazuh 0095-sshd_rules.xml: 5710 (level 5, if_sid 5700, match illegal user|invalid user), 5712, 5758, 5760, 5763, 5715"
      - "ATT&CK T1110.001 Password Guessing, T1021.004 SSH"
      - "Kinh nghiệm SOC: mật khẩu gõ nhầm vào ô username xuất hiện dạng rõ trong log xác thực"
      - "Bổ sung từ bản Nguyên (2026-11-11): ssh không ghi user, không tra lịch sử theo username, mật khẩu trong username xếp medium"

  - rule_id: "5716"
    title: "sshd: lỗi xác thực KHÔNG phải sai mật khẩu (khóa, PAM, phương thức khác)"
    mitre: ["T1110"]
    status: draft
    trigger:                             # từ 0095-sshd_rules.xml
      - "Rule 5716 (level 5, if_sid 5700): dòng log sshd bắt đầu bằng 'Failed' hoặc 'error: PAM: Authentication'"
      - "Dòng 'Failed password' / 'Failed keyboard' / 'authentication error' khớp tiếp rule con 5760 → ra 5760; nên alert 5716 thường là các kiểu lỗi KHÁC: từ chối khóa công khai ('Failed publickey', chỉ ghi khi LogLevel VERBOSE), 'Failed none', lỗi PAM"
      - "8 lần 5716 cùng IP → 5720 (rule không khai báo timeframe trong XML; kiểm hành vi thực tế trên lab)"
      - "Danh sách kiểu lỗi cụ thể cần xác nhận bằng full_log trên lab"
    facts:
      - data.srcip
      - agent.id
      - agent.name, agent.ip
      - timestamp
      - "full_log: KIỂU lỗi (publickey / none / PAM) là thông tin quan trọng nhất của alert này"
      - "data.dstuser / data.srcuser: tài khoản"
    window:
      alert_time: "timestamp của alert 5716"
      note: "Truy vấn DQL (Wazuh Dashboard → Discover, index wazuh-alerts-*)"
    verify:
      - id: V1
        question: "Đây là lỗi kiểu gì (đọc full_log của 5716): khóa công khai bị từ chối, phương thức none, hay lỗi PAM?"
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:5716'
        time_range: "thời điểm alert ± 1 phút"
        interpret: >-
          Failed publickey/none: client SSH thử khóa trước khi hỏi mật khẩu → thường là nhiễu bình thường
          (ssh-agent có nhiều khóa). Lặp nhiều với nhiều tài khoản → có thể là thử khóa bị đánh cắp.
          Lỗi PAM → xử lý gần như sai mật khẩu (xem 5760, 5503).

      - id: V2
        question: "Trong 24 giờ trước có chuỗi lỗi từ cùng srcip không (tìm 5716, 5720, 5758, 5760, 5763)?"
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:(5716 or 5720 or 5758 or 5760 or 5763)'
        time_range: "24 giờ trước thời điểm alert → thời điểm alert; đếm theo tài khoản"
        interpret: >-
          5758 (vượt MaxAuthTries) đi kèm 5716 publickey → client thử quá nhiều khóa (thường cấu hình
          sai). Nhiều tài khoản khác nhau + publickey → nghi thử một khóa bị lộ trên nhiều tài khoản.

      - id: V3
        question: "Sau đó cùng srcip có đăng nhập thành công không (tìm 5715, 40112)?"
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:(5715 or 40112) and timestamp >= "<alert_time>"'
        time_range: "thời điểm alert → now"
        interpret: >-
          Publickey thất bại rồi password thành công vài giây sau, cùng tài khoản → luồng bình thường của
          client. Thành công bằng publickey sau nhiều lần thử khóa trên nhiều tài khoản → nghi khóa bị lộ.

      - id: V4
        question: "Cùng srcip đã từng đăng nhập thành công (5715) vào agent này trong 30 ngày chưa?"
        query: 'agent.id:"<agent_id>" and data.srcip:"<srcip>" and rule.id:5715'
        time_range: "30 ngày trước thời điểm alert"
        interpret: "Có lịch sử → IP quen, nhiều khả năng client cấu hình khóa chưa gọn. Rỗng → nguồn lạ."

    branches:
      - id: B1_key_spraying_success
        when: "V2 cho thấy lỗi publickey trên nhiều tài khoản, VÀ V3 có đăng nhập thành công bằng publickey"
        severity: high
        actions:
          - "Nghi khóa riêng bị lộ: xác định khóa nào (fingerprint trong full_log nếu có), tài khoản nào nhận khóa đó trong authorized_keys"
          - "Xử lý theo playbook 40112 cho lần đăng nhập thành công; đề xuất (cần người phê duyệt) gỡ khóa đó khỏi authorized_keys"
      - id: B2_pam_or_password_like
        when: "V1 là lỗi PAM hoặc có 5760 đi kèm"
        severity: low
        actions:
          - "Xử lý theo playbook 5760 (sai mật khẩu) với cùng srcip và tài khoản"
      - id: B3_repeated_unknown_source
        when: "V2 có chuỗi lỗi trên nhiều tài khoản, V4 không có lịch sử, V3 rỗng"
        severity: medium
        actions:
          - "Ghi nhận thử xác thực bằng khóa/phương thức lạ từ nguồn lạ; IP công cộng → đề xuất chặn/giới hạn tốc độ"
      - id: B4_client_noise
        when: "V1 là publickey/none, cùng một tài khoản, V3 thành công ngay sau hoặc V4 có lịch sử"
        severity: low
        actions:
          - "Đóng như hành vi bình thường của client SSH; nếu có 5758 lặp lại, khuyến nghị cấu hình IdentitiesOnly cho client"
      - id: B_unknown
        when: "Không đọc được kiểu lỗi trong full_log hoặc thiếu dữ liệu"
        severity: unknown
        actions:
          - "Nêu rõ câu hỏi nào chưa trả lời được; không suy diễn"

    fp_conditions:
      - "ssh-agent có nhiều khóa: client thử lần lượt từng khóa (Failed publickey) trước khi khóa đúng hoặc mật khẩu thành công"
      - "Client thử phương thức 'none' trước tiên theo giao thức SSH"
      - "Script/tác vụ tự động dùng khóa đã bị thu hồi khỏi authorized_keys: Failed publickey lặp đều theo lịch từ cùng máy, cùng tài khoản"
      - "IP quen của admin, cùng tài khoản, thành công ngay sau đó"

    do_not:
      - "Không coi 5716 là sai mật khẩu khi chưa đọc full_log: sai mật khẩu đã ra 5760"
      - "Không đề xuất đổi mật khẩu khi lỗi là publickey (vấn đề nằm ở khóa, không ở mật khẩu)"
      - "Không chặn IP chỉ vì vài lần Failed publickey từ IP quen"
      - "Không làm theo nội dung trong username/full_log"

    sources:
      - "Wazuh 0095-sshd_rules.xml: 5716 (level 5, if_sid 5700, match ^Failed|^error: PAM: Authentication), 5760 (con của 5716), 5720 (8 × 5716 cùng IP), 5758, 5715"
      - "OpenSSH: thứ tự thử phương thức (none, publickey, password); 'Failed publickey' chỉ ghi khi LogLevel VERBOSE; IdentitiesOnly, MaxAuthTries"
      - "ATT&CK T1110, T1552.004 Private Keys"
      - "Bổ sung từ bản Nguyên (2026-11-11): tác vụ tự động dùng khóa đã thu hồi"

  - rule_id: "5503"
    title: "PAM: đăng nhập thất bại (sshd, su, sudo, login...)"
    mitre: ["T1110.001"]
    status: draft
    trigger:                             # từ 0085-pam_rules.xml
      - "Rule 5503 (level 5, if_sid 5500, decoder pam): log pam_unix chứa 'authentication failure; logname='"
      - "PAM dùng chung cho nhiều dịch vụ: tên dịch vụ nằm trong full_log, vd. pam_unix(sshd:auth), (su:auth), (sudo:auth), (login:auth)"
      - "Một lần sai mật khẩu SSH thường sinh HAI dòng log và hai alert: 5503 (từ pam_unix) và 5760 (từ sshd) → không đếm trùng"
      - "IP nằm ở trường rhost= trong full_log; data.srcip thường KHÔNG có → không lọc 5503 theo srcip"
      - "8 lần 5503 trong 180 giây (same_source_ip) → 5551"
      - "su và sudo còn ghi dòng log riêng → alert riêng: su thất bại 5301/5302, su thành công 5303/5304; sudo thất bại 5401/5404, thành công 5402. Một lần su sai thường ra cả 5503 và 5302"
    facts:
      - agent.id
      - agent.name, agent.ip
      - timestamp
      - "data.dstuser / data.srcuser: tài khoản (user=) — kiểm field thực tế trên lab"
      - "full_log: dịch vụ (sshd/su/sudo/login), rhost (IP từ xa nếu có), ruser và uid (ai đang gõ khi dùng su/sudo; uid vẫn có khi ruser trống, vd. uid=33 là www-data trên Ubuntu)"
    window:
      alert_time: "timestamp của alert 5503"
      note: "Truy vấn DQL (Wazuh Dashboard → Discover, index wazuh-alerts-*)"
    verify:
      - id: V1
        question: "Lỗi đến từ dịch vụ nào và ai gõ (đọc full_log của 5503: sshd, su, sudo hay login; rhost, ruser)?"
        query: 'agent.id:"<agent_id>" and rule.id:5503 and (data.dstuser:"<user>" or data.srcuser:"<user>")'
        time_range: "thời điểm alert ± 1 phút"
        interpret: >-
          sshd + rhost → đăng nhập từ xa: xử lý theo playbook 5760 (thường có 5760 đi kèm).
          su hoặc sudo → một người ĐÃ ở trên máy đang cố lên quyền khác (ruser/uid là người gõ;
          rhost trống chính là dấu hiệu thử mật khẩu cục bộ, không phải từ xa).
          login → đăng nhập tại console/TTY.

      - id: V2
        question: "Nếu là sshd: có 5760 cùng tài khoản ngay lúc đó không (cùng một lần sai, tìm 5760)?"
        query: 'agent.id:"<agent_id>" and rule.id:5760 and (data.dstuser:"<user>" or data.srcuser:"<user>")'
        time_range: "thời điểm alert ± 1 phút"
        interpret: "Có → 5503 này là bản trùng của một lần sai mật khẩu SSH; điều tra theo alert 5760 đó, không đếm hai lần."

      - id: V3
        question: "Nếu là su/sudo: có thất bại lặp lại (su 5301, 5302; sudo 5401, 5404) hay lên quyền thành công (su 5303, 5304; sudo 5402) ngay sau không?"
        query: 'agent.id:"<agent_id>" and rule.id:(5301 or 5302 or 5303 or 5304 or 5401 or 5402 or 5404)'
        time_range: "thời điểm alert - 10 phút → now"
        interpret: >-
          su: 5302 (sai khi su lên root) / 5303 (su lên root thành công). sudo: 5404 (sai 3 lần) / 5402
          (thành công). Thành công sau nhiều lần sai, bởi tài khoản không thường lên quyền (nhất là
          tài khoản dịch vụ như www-data) → nghi leo thang đặc quyền. Đối chiếu ruser ở V1.

      - id: V4
        question: "Trong 24 giờ trước, tài khoản này có chuỗi đăng nhập thất bại không (tìm 5503, 5551)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5503 or 5551) and (data.dstuser:"<user>" or data.srcuser:"<user>")'
        time_range: "24 giờ trước thời điểm alert → thời điểm alert"
        interpret: "Nhiều lần qua nhiều dịch vụ/IP (rhost khác nhau) → tài khoản đang bị nhắm; vài lần → gõ nhầm."

    branches:
      - id: B1_local_privesc_success
        when: "V1 là su/sudo, V3 có thất bại lặp lại rồi thành công (5303/5304 hoặc 5402), người gõ (ruser) không phải admin quen"
        severity: high
        actions:
          - "Nghi leo thang đặc quyền: xác định phiên của ruser (5501 gần thời điểm alert), kiểm lệnh chạy sau khi lên root"
          - "Đề xuất (cần người phê duyệt): kết thúc phiên, đổi mật khẩu tài khoản đích nếu bị đoán trúng"
      - id: B2_sshd_duplicate
        when: "V1 là sshd và V2 có 5760 tương ứng"
        severity: low
        actions:
          - "Không xử lý riêng; điều tra theo playbook 5760 của lần sai đó"
      - id: B3_local_guessing
        when: "V1 là su/sudo, V3 có thất bại lặp lại (5302 hoặc 5404) nhưng chưa thành công"
        severity: medium
        actions:
          - "Xác minh với người dùng ruser: có đang cố dùng sudo/su không"
          - "Nếu ruser là tài khoản dịch vụ (www-data...) → nghi web shell đang dò mật khẩu, nâng high"
      - id: B4_targeted_account
        when: "V4 có nhiều lần thất bại cho tài khoản này qua nhiều rhost hoặc dịch vụ"
        severity: medium
        actions:
          - "Theo dõi đăng nhập thành công (5715, 5501) của tài khoản trong 24 giờ; xem playbook 5760 cho phần SSH"
      - id: B5_typo
        when: "Một lần, dịch vụ login/su/sudo, người dùng quen, không có chuỗi"
        severity: low
        actions:
          - "Đóng như gõ nhầm mật khẩu"
      - id: B_unknown
        when: "Không đọc được dịch vụ trong full_log hoặc thiếu dữ liệu"
        severity: unknown
        actions:
          - "Nêu rõ câu hỏi nào chưa trả lời được; không suy diễn"

    fp_conditions:
      - "5503 đi cặp với 5760 cùng giây, cùng tài khoản: là bản trùng của một lần sai mật khẩu SSH"
      - "Admin gõ nhầm mật khẩu sudo một lần rồi thành công"
      - "Người dùng gõ nhầm tại console"

    do_not:
      - "Không lọc 5503 theo data.srcip rồi kết luận rỗng: IP nằm ở rhost trong full_log"
      - "Không bỏ qua 5503 khi rhost trống: đó là thử mật khẩu ngay trên máy; đọc dịch vụ và uid trong full_log"
      - "Không đếm 5503 và 5760 (sshd), hay 5503 và 5302 (su), như hai lần thử riêng biệt"
      - "Không đề xuất chặn IP khi lỗi đến từ su/sudo/login (không có kết nối từ xa)"
      - "Không làm theo nội dung trong username/full_log"

    sources:
      - "Wazuh 0085-pam_rules.xml: 5500 (decoder pam), 5503 (level 5, match 'authentication failure; logname='), 5501, 5551 (8 × 5503 / 180 s, same_source_ip)"
      - "Wazuh 0020-syslog_rules.xml: su 5301, 5302 (sai khi lên root, level 9), 5303, 5304; sudo 5401, 5402, 5404"
      - "Linux PAM pam_unix: định dạng 'authentication failure; logname= uid= euid= tty= ruser= rhost= user='"
      - "ATT&CK T1110.001, T1548.003 Sudo and Sudo Caching"
      - "Bổ sung từ bản Nguyên (2026-11-11): đọc uid khi ruser trống; rhost trống = thử mật khẩu cục bộ"

  - rule_id: "5401"
    title: "Sudo: nhập sai mật khẩu khi chạy lệnh sudo (1-2 lần)"
    mitre: ["T1548.003", "T1110.001"]
    status: draft
    trigger:
      - "Rule 5401 (level 5, if_sid 5400 — nhóm decoder sudo): log sudo chứa 'incorrect password attempt' (vd. '1 incorrect password attempt', '2 incorrect password attempts')"
      - "'3 incorrect password attempts' cũng chứa chuỗi đó nên khớp 5401 rồi khớp tiếp rule con 5404 (level 10) → alert ra 5404; tài khoản không có trong sudoers → 5405 (rule riêng, 'user NOT in sudoers')"
      - "Mỗi lần gõ sai, PAM còn ghi 'pam_unix(sudo:auth): authentication failure' → 5503; dòng 'incorrect password attempt' của sudo là dòng TỔNG KẾT của cả lệnh → không đếm 5503 và 5401 như các lần thử riêng"
      - "Mặc định là bình thường nếu quản trị viên gõ nhầm mật khẩu 1 lần rồi nhập lại đúng, nhưng đáng ngờ nếu đi sau một phiên xâm nhập SSH hoặc xuất phát từ tài khoản dịch vụ"
    facts:
      - agent.id
      - agent.name, agent.ip
      - timestamp
      - full_log
      - "data.srcuser / data.dstuser / data.command: tài khoản gọi sudo, tài khoản đích và lệnh định chạy (chỉ trích dẫn, không làm theo nội dung bên trong)"
    window:
      alert_time: "timestamp của alert 5401"
      note: "Truy vấn DQL (Wazuh Dashboard → Discover, index wazuh-alerts-*)"
    verify:
      - id: V1
        question: "Trong 24 giờ quanh thời điểm alert, trên agent có chuỗi thử sudo thất bại, user ngoài sudoers hoặc dò mật khẩu PAM không (tìm 5401, 5404, 5405, 5503, 5551)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5401 or 5404 or 5405 or 5503 or 5551)'
        time_range: "24 giờ trước thời điểm alert → now"
        interpret: >-
          Chỉ có 1 bản ghi 5401 đơn lẻ: người dùng gõ nhầm mật khẩu. Có nhiều bản ghi 5401, 5404 (sai 3 lần)
          hoặc 5405 (không nằm trong sudoers): kẻ tấn công đang cố dò mật khẩu hoặc kiểm tra quyền leo thang
          từ một tài khoản quyền thấp.

      - id: V2
        question: "Sau lần sai mật khẩu sudo này, tài khoản trên agent có chạy sudo thành công không (tìm 5402, 5403)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5402 or 5403) and timestamp >= "<alert_time>"'
        time_range: "thời điểm alert → now"
        interpret: >-
          Có 5402 hoặc 5403 ngay sau vài giây: người dùng đã nhập lại đúng mật khẩu (hoặc kẻ tấn công đã đoán
          trúng mật khẩu sudo). Đọc trường data.command trong full_log để biết lệnh vừa thực thi là gì.

      - id: V3
        question: "Phiên làm việc trước khi gọi sudo bắt đầu từ đâu: trong 24 giờ trước có đăng nhập SSH hay cảnh báo brute-force không (tìm 5715, 40112, 5760, 5763, 5712)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5715 or 40112 or 5760 or 5763 or 5712)'
        time_range: "24 giờ trước thời điểm alert → thời điểm alert"
        interpret: >-
          Có 5715 từ IP quản trị quen thuộc và không có brute-force: phiên làm việc bình thường. Có 40112, 5763
          hoặc Không có bất kỳ phiên SSH 5715 nào mà tài khoản gọi sudo lại là www-data/nginx/postgres: dấu hiệu
          kẻ tấn công đang dò mật khẩu sudo từ phiên xâm nhập hoặc từ webshell/RCE.

      - id: V4
        question: "Chỉ khi đã có sudo thành công đáng nghi: sau đó agent có tạo group/user (5901, 5902, 2961) hay đổi file nhạy cảm (550, 553, 554) không?"
        query: 'agent.id:"<agent_id>" and rule.id:(5901 or 5902 or 2961 or 550 or 553 or 554) and timestamp >= "<alert_time>"'
        time_range: "thời điểm alert → now"
        interpret: >-
          Có tạo tài khoản mới hoặc sửa đổi file hệ thống sau khi dò trúng mật khẩu sudo: xác nhận kẻ tấn công
          đã leo thang lên root và đang tạo chốt chặn.

    branches:
      - id: B1_escalated_after_guessing
        when: "V2 có sudo thành công VÀ (V1 có chuỗi dò mật khẩu nhiều lần hoặc V3 phát hiện phiên xâm nhập/tài khoản dịch vụ hoặc V4 có tạo user/sửa file nhạy cảm)"
        severity: high
        actions:
          - "Xác minh khẩn với quản trị viên hệ thống và chủ tài khoản <user>"
          - "Kiểm tra toàn bộ lệnh đã chạy trong V2 và các thay đổi ở V4"
          - "Đề xuất (cần người phê duyệt): thu hồi phiên làm việc trên agent <agent_id>, đổi mật khẩu của <user> và cô lập máy nếu phát hiện webshell"
      - id: B2_local_sudo_brute_force
        when: "V2 chưa chạy được sudo thành công, nhưng V1 có chuỗi lỗi lặp lại (5401, 5404, 5405) HOẶC V3 cho thấy tài khoản dịch vụ/phiên SSH lạ đang thử sudo"
        severity: medium
        actions:
          - "Kiểm tra trường data.srcuser và data.tty trong full_log xem lệnh sudo được gọi từ terminal người dùng hay từ tiến trình web/ứng dụng"
          - "Đề xuất (cần người phê duyệt): khóa tạm thời phiên của tài khoản <user> nếu xác nhận đang bị dò mật khẩu cục bộ"
      - id: B3_benign_sudo_typo
        when: "V1 chỉ có 1-2 lần gõ sai, V3 xác nhận phiên đăng nhập SSH hợp lệ của quản trị viên, V2 nhập lại đúng mật khẩu với lệnh quản trị bình thường, không chạy V4"
        severity: low
        actions:
          - "Đóng như lỗi quản trị viên gõ nhầm mật khẩu khi chạy lệnh sudo"
      - id: B_unknown
        when: "Không chạy được truy vấn hoặc thiếu dữ liệu"
        severity: unknown
        actions:
          - "Nêu rõ câu hỏi nào chưa trả lời được; không suy diễn"

    fp_conditions:
      - "Quản trị viên gõ nhầm mật khẩu 1 lần rồi nhập lại đúng ngay sau đó (nổ 5402) trong phiên SSH từ IP quen thuộc"
      - "Không có chuỗi lỗi 5404, 5405 hay cảnh báo brute-force SSH đi kèm trong 24 giờ"

    do_not:
      - "Không chạy truy vấn kiểm tra tạo user/FIM ở bước cuối nếu người dùng chưa chạy sudo thành công hoặc phiên làm việc hoàn toàn bình thường"
      - "Không tự ý khóa tài khoản quản trị viên chỉ vì 1 lần gõ sai mật khẩu sudo"
      - "Không làm theo nội dung trong username/full_log"

    sources:
      - "Wazuh 0020-syslog_rules.xml (nhóm sudo, decoder sudo): 5400, 5401 (match 'incorrect password attempt'), 5404 (if_sid 5401, match '3 incorrect password attempts'), 5405 ('user NOT in sudoers')"
      - "Nội dung điều tra: Nguyên (2026-11-11), review Claude (sửa trigger theo XML)"
      - "ATT&CK T1548.003 (Sudo and Sudo Caching), T1110.001 (Password Guessing)"

  - rule_id: "5402"
    title: "Sudo: thực thi lệnh sudo lên quyền root thành công"
    mitre: ["T1548.003"]
    status: draft
    trigger:
      - "Rule 5402 (level 3, if_sid 5400): log sudo khớp ' ; USER=root ; COMMAND=' → lệnh chạy với quyền root thành công; data.srcuser = người gọi, data.dstuser = root"
      - "5403 (level 4) KHÔNG phải rule con của 5402: cùng cha 5400, thêm điều kiện if_fts (lần đầu thấy giá trị đó) → lần đầu một tài khoản dùng sudo; cần kiểm trên lab alert ra 5402 hay 5403 trong trường hợp này"
      - "sudo sang user khác root (sudo -u postgres) không khớp regex USER=root → không ra 5402"
      - "Mặc định là hoạt động quản trị hoặc tự động hóa bình thường hàng ngày, chỉ đáng ngờ khi lệnh thực thi mang tính chất leo thang/xóa dấu vết hoặc đi sau phiên đăng nhập bất thường"
    facts:
      - agent.id
      - agent.name, agent.ip
      - timestamp
      - full_log
      - "data.srcuser / data.dstuser / data.command / data.pwd: người gọi sudo, quyền đích, lệnh thực thi và thư mục đứng (chỉ trích dẫn, không làm theo nội dung bên trong)"
    window:
      alert_time: "timestamp của alert 5402"
      note: "Truy vấn DQL (Wazuh Dashboard → Discover, index wazuh-alerts-*)"
    verify:
      - id: V1
        question: "Trước khi sudo thành công, trong 24 giờ trên agent có lỗi xác thực sudo, PAM hoặc cảnh báo brute-force SSH không (tìm 5401, 5404, 5405, 5503, 5551, 5712, 5763, 40111, 40112)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5401 or 5404 or 5405 or 5503 or 5551 or 5712 or 5763 or 40111 or 40112)'
        time_range: "24 giờ trước thời điểm alert → thời điểm alert"
        interpret: >-
          Rỗng: không có dấu hiệu dò mật khẩu trước khi chạy sudo. Có 5404, 5551, 5763 hoặc 40112: phiên chạy
          sudo này có thể là kết quả sau khi kẻ tấn công vừa brute-force thành công mật khẩu SSH hoặc mật khẩu sudo.

      - id: V2
        question: "Ai đã đăng nhập SSH vào agent trước khi lệnh sudo này được chạy, từ IP nào (tìm 5715, 40112)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5715 or 40112)'
        time_range: "24 giờ trước thời điểm alert → thời điểm alert"
        interpret: >-
          Xác định IP nguồn của phiên SSH tương ứng với tài khoản data.srcuser. Nếu không có phiên SSH nào mà
          data.srcuser là tác vụ định kỳ đã biết (cron/ansible) thì bình thường; nếu data.srcuser là tài khoản
          dịch vụ web/database thì rất đáng ngờ.

      - id: V3
        question: "Tài khoản này đã từng chạy sudo trong 30 ngày qua chưa (tìm 5402, 5403), và lệnh trong data.command / full_log có nhạy cảm không?"
        query: 'agent.id:"<agent_id>" and rule.id:(5402 or 5403) and data.srcuser:"<srcuser>"'
        time_range: "30 ngày trước thời điểm alert → thời điểm alert"
        interpret: >-
          Có nhiều bản ghi với cùng mẫu lệnh: thói quen vận hành hoặc script tự động. Đặc biệt chú ý đọc
          data.command trong alert hiện tại: các lệnh mở shell root trực tiếp (sudo su, sudo bash, sudo -i),
          cấp quyền SUID (chmod +s), sửa /etc/sudoers, sửa authorized_keys hoặc tải script từ mạng cần được
          xem xét kỹ hơn các lệnh bảo trì thông thường (systemctl, apt, journalctl).

      - id: V4
        question: "Chỉ khi có dấu hiệu dò mật khẩu, phiên đăng nhập lạ hoặc lệnh nhạy cảm: sau thời điểm alert, agent có tạo group/user (5901, 5902, 2961) hay đổi file nhạy cảm (550, 553, 554) không?"
        query: 'agent.id:"<agent_id>" and rule.id:(5901 or 5902 or 2961 or 550 or 553 or 554) and timestamp >= "<alert_time>"'
        time_range: "thời điểm alert → now"
        interpret: >-
          Có tạo user mới hoặc thay đổi file cấu hình trọng yếu sau một lệnh sudo đáng nghi: dấu hiệu kẻ tấn
          công đang thiết lập quyền truy cập bền vững (persistence) dưới quyền root.

    branches:
      - id: B1_malicious_root_execution
        when: "(V1 có chuỗi brute-force hoặc V2 đến từ IP xâm nhập trái phép) VÀ (V3 thực thi lệnh độc hại/mở shell root hoặc V4 phát hiện tạo user/sửa file nhạy cảm)"
        severity: high
        actions:
          - "Xác minh khẩn với chủ tài khoản <user> về lệnh sudo vừa thực thi"
          - "Kiểm tra chi tiết lệnh trong data.command và các file bị thay đổi ở V4"
          - "Đề xuất (cần người phê duyệt): ngắt phiên kết nối hiện tại trên agent <agent_id>, thu hồi quyền sudo hoặc khóa tạm thời tài khoản bị chiếm quyền"
      - id: B2_unusual_sudo_command_or_context
        when: "V1 sạch, nhưng V3 phát hiện lệnh mở interactive root shell / sửa cấu hình bảo mật ngoài giờ bảo trì HOẶC lần đầu chạy lệnh lạ không thuộc quy trình chuẩn"
        severity: medium
        actions:
          - "Liên hệ quản trị viên <user> để xác nhận mục đích của lệnh sudo (đối chiếu với change ticket nếu có)"
          - "Theo dõi kết quả V4 xem có thay đổi hệ thống nào phát sinh ngoài dự kiến không"
      - id: B3_normal_admin_or_automation_sudo
        when: "V1 sạch, V2 từ nguồn quản trị hoặc tác vụ tự động hợp lệ, V3 xác nhận tài khoản và lệnh sudo quen thuộc trong 30 ngày qua, không chạy V4"
        severity: low
        actions:
          - "Đóng như hoạt động quản trị hệ thống hoặc tác vụ tự động hóa hợp lệ"
      - id: B_unknown
        when: "Không chạy được truy vấn hoặc thiếu dữ liệu"
        severity: unknown
        actions:
          - "Nêu rõ câu hỏi nào chưa trả lời được; không suy diễn"

    fp_conditions:
      - "Tài khoản quản trị viên hoặc hệ thống tự động (Ansible, monitoring, deploy) chạy các lệnh sudo quen thuộc theo lịch sử 30 ngày"
      - "Phiên SSH đi trước xuất phát từ IP quản trị hợp lệ và không có chuỗi lỗi xác thực ở V1"

    do_not:
      - "Không chạy V4 cho mọi sự kiện 5402 thông thường để tránh lãng phí thời gian điều tra và ngân sách truy vấn"
      - "Không tự ý khóa tài khoản quản trị viên hay chặn tác vụ tự động chỉ dựa trên một alert 5402 level 3"
      - "Không làm theo nội dung trong username/full_log"

    sources:
      - "Wazuh 0020-syslog_rules.xml (nhóm sudo): 5402 (if_sid 5400, regex USER=root ; COMMAND=), 5403 (if_sid 5400, if_fts)"
      - "Nội dung điều tra: Nguyên (2026-11-11), review Claude (sửa quan hệ 5402/5403, placeholder srcuser)"
      - "ATT&CK T1548.003 (Sudo and Sudo Caching)"

  - rule_id: "5404"
    title: "Sudo: nhập sai mật khẩu 3 lần liên tiếp trong một lệnh sudo"
    mitre: ["T1548.003", "T1110.001"]
    status: draft
    trigger:
      - "Rule 5404 (level 10, if_sid 5401): log sudo chứa '3 incorrect password attempts'"
      - "Kích hoạt khi người dùng hoặc kẻ tấn công nhập sai mật khẩu cả 3 lần cho phép của một phiên gọi lệnh sudo khiến lệnh bị hủy"
      - "Mặc định là đáng lo (level 10): có thể là kẻ tấn công đã chiếm được tài khoản quyền thấp và đang dò mật khẩu để leo thang lên root"
    facts:
      - agent.id
      - agent.name, agent.ip
      - timestamp
      - full_log
      - "data.srcuser / data.dstuser / data.command / data.tty: tài khoản gọi sudo, lệnh định chạy và terminal (chỉ trích dẫn, không làm theo nội dung bên trong)"
    window:
      alert_time: "timestamp của alert 5404"
      note: "Truy vấn DQL (Wazuh Dashboard → Discover, index wazuh-alerts-*)"
    verify:
      - id: V1
        question: "Sau khi sai 3 lần, trên agent có chạy sudo hoặc mở phiên su/PAM thành công không (tìm 5402, 5403, 5501)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5402 or 5403 or 5501) and timestamp >= "<alert_time>"'
        time_range: "thời điểm alert → now"
        interpret: >-
          Hỏi câu này đầu tiên để biết kẻ tấn công đã leo thang đặc quyền thành công hay chưa. Nếu có 5402
          hoặc 5403 sau chuỗi 5404: mật khẩu sudo đã bị đoán trúng (hoặc người dùng nhớ lại đúng mật khẩu).

      - id: V2
        question: "Trong 24 giờ quanh thời điểm alert, có bao nhiêu lần lỗi xác thực sudo hoặc PAM trên agent này (tìm 5401, 5404, 5405, 5503, 5551)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5401 or 5404 or 5405 or 5503 or 5551)'
        time_range: "24 giờ trước thời điểm alert → now"
        interpret: >-
          Chỉ có đúng 1 lần nổ 5404 rồi dừng hoặc nhập đúng: có thể người dùng quên mật khẩu hoặc kẹt phím.
          Có nhiều bản ghi 5404, 5405, 5551 nối tiếp nhau: hành vi brute-force mật khẩu cục bộ rõ rệt.

      - id: V3
        question: "Tài khoản gọi sudo đăng nhập vào agent bằng cách nào: trong 24 giờ trước có phiên SSH hay cảnh báo brute-force SSH không (tìm 5715, 40112, 5760, 5763, 5712)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5715 or 40112 or 5760 or 5763 or 5712)'
        time_range: "24 giờ trước thời điểm alert → thời điểm alert"
        interpret: >-
          Có 40112 hoặc 5715 từ IP lạ: kẻ tấn công vừa xâm nhập qua SSH và đang tìm cách leo thang lên root.
          Không có phiên SSH 5715 mà lệnh sudo được gọi từ tài khoản dịch vụ hoặc pts/tty lạ: kiểm tra nguy cơ
          webshell hoặc RCE trên ứng dụng.

      - id: V4
        question: "Chỉ khi đã có sudo thành công sau chuỗi sai mật khẩu: sau đó agent có tạo group/user (5901, 5902, 2961) hay đổi file nhạy cảm (550, 553, 554) không?"
        query: 'agent.id:"<agent_id>" and rule.id:(5901 or 5902 or 2961 or 550 or 553 or 554) and timestamp >= "<alert_time>"'
        time_range: "thời điểm alert → now"
        interpret: >-
          Có bản ghi tạo user mới, thêm vào group sudo hoặc sửa file hệ thống sau khi vừa dò trúng mật khẩu:
          xác nhận máy chủ đã bị chiếm quyền root.

    branches:
      - id: B1_sudo_compromised
        when: "V1 có sudo/PAM thành công VÀ (V2 có nhiều lần dò mật khẩu hoặc V3 xuất phát từ phiên xâm nhập/tài khoản dịch vụ hoặc V4 có tạo user/sửa file)"
        severity: high
        actions:
          - "Xác minh khẩn với quản trị viên hệ thống và chủ tài khoản <user>"
          - "Kiểm tra lệnh thực thi trong V1 và các thay đổi hệ thống ở V4"
          - "Đề xuất (cần người phê duyệt): ngắt toàn bộ phiên của <user> trên agent <agent_id>, đặt lại mật khẩu và cô lập máy chủ nếu đã bị cài backdoor"
      - id: B2_active_local_escalation_attempt
        when: "V1 chưa thành công, nhưng V2 có nhiều lần nổ 5404/5405/5551 HOẶC V3 cho thấy phiên SSH đáng nghi / tài khoản dịch vụ gọi sudo"
        severity: medium
        actions:
          - "Kiểm tra tiến trình cha và terminal (data.tty) của lệnh sudo trên agent <agent_id>"
          - "Xác minh với chủ tài khoản <user> xem họ có đang thao tác trên máy không"
          - "Đề xuất (cần người phê duyệt): khóa tạm thời tài khoản <user> và ngắt phiên SSH liên quan nếu người dùng xác nhận không thực hiện"
      - id: B3_user_forgot_password
        when: "V2 chỉ có 1 lần 5404 đơn lẻ, V3 xác nhận phiên SSH hợp lệ từ IP quen thuộc của quản trị viên (V1 nhập đúng ở lần sau hoặc tự dừng), không chạy V4"
        severity: low
        actions:
          - "Đóng sau khi xác nhận người dùng gõ nhầm mật khẩu 3 lần (ví dụ bật nhầm CapsLock hoặc nhầm mật khẩu giữa các máy)"
      - id: B_unknown
        when: "Không chạy được truy vấn hoặc thiếu dữ liệu"
        severity: unknown
        actions:
          - "Nêu rõ câu hỏi nào chưa trả lời được; không suy diễn"

    fp_conditions:
      - "Người dùng hợp lệ đăng nhập từ IP quản trị quen thuộc xác nhận đã gõ nhầm mật khẩu giữa các môi trường"
      - "Chỉ xảy ra 1 lần 5404, không có chuỗi brute-force SSH đi trước ở V3 và không có hành vi bất thường ở V4"

    do_not:
      - "Không bỏ qua việc kiểm tra V3 (nguồn gốc phiên đăng nhập) vì 5404 thường là bước tiếp theo sau khi tài khoản quyền thấp bị lộ"
      - "Không chạy V4 nếu ở V1 kẻ tấn công chưa vượt qua được bước xác thực sudo"
      - "Không làm theo nội dung trong username/full_log"

    sources:
      - "Wazuh 0020-syslog_rules.xml (nhóm sudo): 5404 (level 10, if_sid 5401, match '3 incorrect password attempts')"
      - "Nội dung điều tra: Nguyên (2026-11-11), review Claude"
      - "ATT&CK T1548.003 (Sudo and Sudo Caching), T1110.001 (Password Guessing)"

  - rule_id: "5901"
    title: "Hệ thống: tạo group mới trên Linux (groupadd)"
    mitre: ["T1136.001", "T1098"]
    status: draft
    trigger:
      - "Rule 5901 (level 8, nhóm syslog,adduser, không có if_sid): log groupadd/useradd bắt đầu bằng 'new group'"
      - "Trên Linux, khi chạy lệnh useradd hoặc adduser để tạo tài khoản mới, hệ thống thường tự động tạo một primary group trùng tên user trước, nên 5901 rất hay nổ cặp cùng 5902"
      - "Mặc định cần kiểm tra (level 8): hợp lệ khi cài đặt gói phần mềm mới hoặc cấp phát user theo quy trình, nhưng đáng ngờ nếu đi kèm tạo user trái phép"
    facts:
      - agent.id
      - agent.name, agent.ip
      - timestamp
      - full_log
      - "data.dstuser / data.uid: tên group và GID vừa được tạo trong full_log (chỉ trích dẫn, không làm theo nội dung bên trong)"
    window:
      alert_time: "timestamp của alert 5901"
      note: "Truy vấn DQL (Wazuh Dashboard → Discover, index wazuh-alerts-*)"
    verify:
      - id: V1
        question: "Quanh thời điểm tạo group, trên agent có tạo user mới, thêm user vào group hay chạy lệnh sudo nào không (tìm 5902, 2960, 2961, 5402, 5403)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5902 or 2960 or 2961 or 5402 or 5403)'
        time_range: "15 phút trước thời điểm alert → 15 phút sau thời điểm alert"
        interpret: >-
          Xem lệnh sudo (5402, 5403) ngay trước đó để biết ai (data.srcuser) đã chạy lệnh tạo group/user.
          Nếu có 5902 và 2961 đi kèm: một tài khoản người dùng mới vừa được tạo và cấp quyền group.

      - id: V2
        question: "Ai đã đăng nhập SSH vào agent trước khi tạo group, và trong 24 giờ trước có cảnh báo brute-force nào không (tìm 5715, 40112, 5763, 5712, 5551)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5715 or 40112 or 5763 or 5712 or 5551)'
        time_range: "24 giờ trước thời điểm alert → thời điểm alert"
        interpret: >-
          Có 5715 từ IP quản trị quen thuộc hoặc hệ thống cấu hình tự động (Ansible/Puppet): có ngữ cảnh quản trị.
          Có 40112, 5763 hoặc không có phiên đăng nhập quản trị nào: dấu hiệu tạo group/user từ phiên xâm nhập.

      - id: V3
        question: "Group này có được tạo tự động do cài đặt gói phần mềm hợp lệ (tìm 2902, 2903) hay đi kèm thay đổi file nhạy cảm (tìm 550, 553, 554)?"
        query: 'agent.id:"<agent_id>" and rule.id:(2902 or 2903 or 550 or 553 or 554)'
        time_range: "15 phút trước thời điểm alert → 15 phút sau thời điểm alert"
        interpret: >-
          Có 2902, 2903 (dpkg/rpm/yum cài đặt gói) và tên group trùng với tên dịch vụ (như docker, nginx,
          postgres, zabbix): hoạt động cài đặt phần mềm bình thường. Nếu không có cài đặt gói mà có 550/554
          trên /etc/sudoers hoặc authorized_keys: rất đáng ngờ.

    branches:
      - id: B1_unauthorized_group_and_user
        when: "V2 có dấu hiệu xâm nhập/IP lạ HOẶC (V1 tạo kèm user mới/cấp quyền sudo trái phép và V3 không phải cài đặt phần mềm hợp lệ)"
        severity: high
        actions:
          - "Xác minh khẩn với quản trị viên hệ thống về group và user vừa được tạo ở V1"
          - "Kiểm tra file /etc/group, /etc/passwd và /etc/sudoers trên agent <agent_id>"
          - "Đề xuất (cần người phê duyệt): xóa user và group trái phép, thu hồi phiên làm việc đáng nghi trên agent <agent_id>"
      - id: B2_unverified_admin_change
        when: "V2 là phiên quản trị nội bộ, V1 tạo group/user thủ công và V3 không gắn với cài đặt gói tự động nhưng chưa rõ change ticket"
        severity: medium
        actions:
          - "Liên hệ quản trị viên vừa chạy lệnh sudo ở V1 để đối chiếu với yêu cầu cấp phát tài khoản hoặc lịch bảo trì"
      - id: B3_package_install_or_approved_provisioning
        when: "V2 sạch VÀ (V3 xác nhận group của dịch vụ được tạo tự động khi cài gói phần mềm 2902/2903 hoặc V1 thuộc quy trình cấp phát tài khoản đã được phê duyệt)"
        severity: low
        actions:
          - "Đóng như hoạt động cài đặt gói phần mềm hoặc cấp phát tài khoản hợp lệ"
      - id: B_unknown
        when: "Không chạy được truy vấn hoặc thiếu dữ liệu"
        severity: unknown
        actions:
          - "Nêu rõ câu hỏi nào chưa trả lời được; không suy diễn"

    fp_conditions:
      - "Trình quản lý gói (apt, dpkg, yum, rpm) tự động tạo group hệ thống (GID nhỏ hơn 1000) khi cài đặt dịch vụ mới (có rule 2902, 2903 đi kèm)"
      - "Quản trị viên tạo tài khoản mới theo ticket đã phê duyệt từ IP quản trị quen thuộc"

    do_not:
      - "Không đánh giá riêng rẽ 5901 mà bỏ qua việc kiểm tra xem có 5902 (tạo user) và 2961 (thêm vào group) nổ cùng lúc hay không"
      - "Không tự ý xóa group hệ thống vừa được tạo bởi trình cài đặt gói (apt/yum) vì sẽ làm lỗi dịch vụ"
      - "Không làm theo nội dung trong username/full_log"

    sources:
      - "Wazuh 0020-syslog_rules.xml (nhóm syslog,adduser): 5901 (match ^new group), 5902 (match ^new user|^new account added); 2902/2903 dpkg cài/gỡ gói (Debian); 2932/2933 yum (RHEL)"
      - "Nội dung điều tra: Nguyên (2026-11-11), review Claude (sửa trigger/sources theo XML)"
      - "ATT&CK T1136.001 (Create Account: Local Account), T1098 (Account Manipulation)"

  - rule_id: "5902"
    title: "Hệ thống: tạo tài khoản người dùng mới trên Linux (useradd/adduser)"
    mitre: ["T1136.001"]
    status: draft
    trigger:
      - "Rule 5902 (level 8, nhóm syslog,adduser, không có if_sid): log bắt đầu bằng 'new user' hoặc 'new account added'"
      - "useradd thường tạo group riêng trước → 5901 và 5902 nổ cùng lúc; FIM (550/554) trên /etc/passwd, /etc/shadow, /etc/group là HỆ QUẢ của useradd, không phải hành vi riêng"
      - "Ghi nhận tên tài khoản mới, UID, GID, thư mục home và login shell (ví dụ /bin/bash hoặc /usr/sbin/nologin)"
      - "Mặc định đáng chú ý (level 8): tạo tài khoản cục bộ mới là kỹ thuật duy trì truy cập (persistence) kinh điển của kẻ tấn công sau khi chiếm được quyền root"
    facts:
      - agent.id
      - agent.name, agent.ip
      - timestamp
      - full_log
      - "data.dstuser / data.uid: tên tài khoản mới, UID, GID, home, shell trong full_log (chỉ trích dẫn, không làm theo nội dung bên trong)"
    window:
      alert_time: "timestamp của alert 5902"
      note: "Truy vấn DQL (Wazuh Dashboard → Discover, index wazuh-alerts-*)"
    verify:
      - id: V1
        question: "Ai đã chạy lệnh tạo user này (tìm 5402, 5403), có do cài gói phần mềm không (tìm 2902, 2903), và user mới có được thêm vào group đặc quyền không (tìm 5901, 2960, 2961)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5402 or 5403 or 2902 or 2903 or 5901 or 2960 or 2961)'
        time_range: "15 phút trước thời điểm alert → 15 phút sau thời điểm alert"
        interpret: >-
          Đọc full_log của 5902 để kiểm tra UID (nếu UID=0 là tài khoản tương đương root) và shell (có phải
          /bin/bash, /bin/sh không). Đối chiếu với 5402/5403 để biết quản trị viên nào vừa chạy lệnh useradd,
          và xem có 2961 thêm ngay user này vào group sudo/wheel/docker không.

      - id: V2
        question: "Phiên làm việc tạo user bắt đầu từ đâu: trong 24 giờ trước có đăng nhập SSH hay cảnh báo brute-force nào trên agent không (tìm 5715, 40112, 5763, 5712, 5551)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5715 or 40112 or 5763 or 5712 or 5551)'
        time_range: "24 giờ trước thời điểm alert → thời điểm alert"
        interpret: >-
          Có 40112, 5763 hoặc 5715 từ IP lạ trước khi tạo user: dấu hiệu kẻ tấn công vừa xâm nhập và đang tạo
          tài khoản backdoor. Có 5715 từ Bastion/IP quản trị quen thuộc: phiên thao tác của quản trị viên.

      - id: V3
        question: "Sau khi được tạo, tài khoản mới hoặc agent có đăng nhập SSH, mở phiên PAM, chạy sudo hay sửa file nhạy cảm không (tìm 5715, 5501, 5402, 5403, 550, 553, 554)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5715 or 5501 or 5402 or 5403 or 550 or 553 or 554) and timestamp >= "<alert_time>"'
        time_range: "thời điểm alert → now"
        interpret: >-
          Có 5715 (đăng nhập SSH ngay vào tài khoản mới), 5402/5403 (chạy sudo từ tài khoản mới) hoặc 550/554
          (thêm SSH key vào authorized_keys của user mới): tài khoản vừa tạo đã được kích hoạt để sử dụng.

    branches:
      - id: B1_backdoor_user_created
        when: "full_log có UID=0 HOẶC V2 có dấu hiệu xâm nhập/brute-force HOẶC (V1 cấp shell tương tác/quyền sudo mà không do quản trị viên hợp lệ thực hiện) HOẶC V3 phát hiện hành vi hậu khai thác"
        severity: high
        actions:
          - "Xác minh khẩn với quản trị viên hệ thống về tài khoản <user> vừa được tạo"
          - "Kiểm tra /etc/passwd, /etc/shadow, /etc/sudoers và thư mục home của <user> trên agent <agent_id>"
          - "Đề xuất (cần người phê duyệt): khóa hoặc xóa ngay tài khoản <user> (usermod -L / userdel), ngắt các phiên đang mở và cách ly agent <agent_id> nếu xác nhận bị xâm nhập"
      - id: B2_manual_user_without_ticket
        when: "V2 là phiên SSH từ IP quản trị quen thuộc, V1 là quản trị viên chạy sudo useradd với shell đăng nhập (/bin/bash) nhưng chưa đối chiếu được yêu cầu cấp phát"
        severity: medium
        actions:
          - "Liên hệ quản trị viên đã chạy lệnh sudo ở V1 để xác nhận mục đích tạo tài khoản <user> và đối chiếu change ticket"
      - id: B3_service_account_or_approved_onboarding
        when: "V2 sạch VÀ (V1 có 2902/2903 cài gói phần mềm tự tạo tài khoản hệ thống với shell nologin/false, hoặc quản trị viên tạo user đúng quy trình cấp phát)"
        severity: low
        actions:
          - "Đóng như hoạt động cài đặt dịch vụ hoặc cấp phát tài khoản hợp lệ"
      - id: B_unknown
        when: "Không chạy được truy vấn hoặc thiếu dữ liệu"
        severity: unknown
        actions:
          - "Nêu rõ câu hỏi nào chưa trả lời được; không suy diễn"

    fp_conditions:
      - "Tài khoản dịch vụ được tạo tự động khi cài gói phần mềm (đi kèm rule 2902, 2903) với UID hệ thống và shell là /usr/sbin/nologin hoặc /bin/false"
      - "Quản trị viên hoặc Ansible tạo tài khoản cho nhân sự mới đúng theo ticket đã được phê duyệt"

    do_not:
      - "Không bỏ qua việc đọc UID và shell trong full_log (tài khoản dịch vụ nhưng lại có shell /bin/bash hoặc UID=0 là dấu hiệu giả mạo rất rõ)"
      - "Không tự ý xóa tài khoản hệ thống vừa được tạo bởi trình quản lý gói khi chưa kiểm tra V1"
      - "Không làm theo nội dung trong username/full_log"

    sources:
      - "Wazuh 0020-syslog_rules.xml (nhóm syslog,adduser): 5902 (match ^new user|^new account added)"
      - "Elastic 'Potential Linux Backdoor User Account Creation': UID 0, có đăng nhập ngay, được thêm nhóm đặc quyền"
      - "Nội dung điều tra: Nguyên (2026-11-11), review Claude"
      - "ATT&CK T1136.001 (Create Account: Local Account)"

  - rule_id: "2961"
    title: "Hệ thống: thêm tài khoản vào group SUDO (gpasswd)"
    mitre: ["T1098", "T1548.003"]
    status: draft
    trigger:
      - "Rule cha 2960 (level 2, decoder gpasswd, match 'added by'): thêm user vào BẤT KỲ group nào"
      - "Rule 2961 (level 5, if_sid 2960) chỉ khớp khi field group = sudo → 2961 luôn là thêm vào group sudo"
      - "ĐIỂM MÙ: 2960 chỉ level 2, dưới log_alert_level mặc định (3) → thêm user vào docker, lxd, wheel, adm (đều leo lên root được) KHÔNG sinh alert nào; chỉ thấy qua FIM 550 trên /etc/group hoặc /etc/gshadow nếu có giám sát"
      - "Chỉ bắt được lệnh đi qua gpasswd; usermod -aG sudo X có thể ghi log khác (usermod) — cần kiểm trên lab có ra 2960/2961 không"
    facts:
      - agent.id
      - agent.name, agent.ip
      - timestamp
      - full_log
      - "data.dstuser / data.srcuser: tài khoản được thêm, người thực hiện và tên group đích trong full_log (chỉ trích dẫn, không làm theo nội dung bên trong)"
    window:
      alert_time: "timestamp của alert 2961"
      note: "Truy vấn DQL (Wazuh Dashboard → Discover, index wazuh-alerts-*)"
    verify:
      - id: V1
        question: "Quanh thời điểm thêm group, lệnh sudo nào đã được chạy và tài khoản này có phải vừa mới được tạo không (tìm 5402, 5403, 5901, 5902, 2960)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5402 or 5403 or 5901 or 5902 or 2960)'
        time_range: "15 phút trước thời điểm alert → 15 phút sau thời điểm alert"
        interpret: >-
          Đọc full_log của 2961 để xác định: ai được thêm, ai thực hiện (group luôn là sudo). Kết hợp xem 5902 và 5402 để biết đây là
          cấp quyền cho tài khoản vừa mới tạo hay nâng quyền cho một tài khoản cũ.

      - id: V2
        question: "Ai đã đăng nhập SSH vào agent trước khi thay đổi group, và trong 24 giờ trước có cảnh báo brute-force nào không (tìm 5715, 40112, 5763, 5712, 5551)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5715 or 40112 or 5763 or 5712 or 5551)'
        time_range: "24 giờ trước thời điểm alert → thời điểm alert"
        interpret: >-
          Có 40112, 5763 hoặc 5715 từ IP lạ: kẻ tấn công sau khi chiếm được quyền đang tự thêm tài khoản vào
          group đặc quyền để duy trì quyền root. Có 5715 từ IP quản trị quen thuộc: thao tác của quản trị viên.

      - id: V3
        question: "Sau khi được thêm vào group, trên agent có phát sinh lệnh sudo mới, mở phiên PAM hay sửa đổi file nhạy cảm không (tìm 5402, 5403, 5404, 5501, 550, 553, 554)?"
        query: 'agent.id:"<agent_id>" and rule.id:(5402 or 5403 or 5404 or 5501 or 550 or 553 or 554) and timestamp >= "<alert_time>"'
        time_range: "thời điểm alert → now"
        interpret: >-
          Có 5403 (lần đầu tiên user chạy sudo) hoặc 5402 ngay sau khi được thêm vào group sudo/wheel: tài khoản
          vừa được nâng quyền đã lập tức sử dụng quyền mới để thực thi lệnh với quyền root.

    branches:
      - id: B1_unauthorized_privilege_group_grant
        when: "V2 có dấu hiệu xâm nhập/IP lạ, hoặc V1 cho thấy thêm cho tài khoản dịch vụ/user lạ/user vừa tạo trái phép, hoặc V3 có lệnh hậu khai thác"
        severity: high
        actions:
          - "Xác minh khẩn với quản trị viên hệ thống về việc cấp quyền group trong full_log"
          - "Kiểm tra toàn bộ lệnh sudo mà tài khoản vừa chạy ở V3"
          - "Đề xuất (cần người phê duyệt): gỡ ngay tài khoản khỏi group đặc quyền (gpasswd -d), thu hồi phiên làm việc và khóa tài khoản nếu trái phép"
      - id: B2_unverified_sudo_or_docker_group_add
        when: "V2 là phiên quản trị bình thường, nhưng chưa có thông tin phê duyệt việc cấp quyền sudo"
        severity: medium
        actions:
          - "Liên hệ quản trị viên thực hiện lệnh ở V1 để xác nhận yêu cầu cấp quyền sudo"
          - "Kiểm thêm /etc/group: user có nằm trong docker/lxd/wheel không (các group này không sinh alert, xem trigger)"
      - id: B3_benign_group_assignment
        when: "V2 sạch VÀ việc cấp quyền sudo thuộc quy trình cấp phát đã được phê duyệt"
        severity: low
        actions:
          - "Đóng như thao tác phân quyền group hợp lệ của quản trị viên hoặc trình cài đặt"
      - id: B_unknown
        when: "Không chạy được truy vấn hoặc thiếu dữ liệu"
        severity: unknown
        actions:
          - "Nêu rõ câu hỏi nào chưa trả lời được; không suy diễn"

    fp_conditions:
      - "Quản trị viên phân quyền cho nhân sự hoặc dịch vụ theo đúng change ticket từ phiên SSH quản trị hợp lệ"
      - "Onboarding quản trị viên mới theo ticket (thêm vào sudo là bước chuẩn)"

    do_not:
      - "Không coi việc không có 2961 là không có leo quyền qua group: docker/lxd/wheel chỉ ra 2960 level 2 (không thành alert); thành viên docker/lxd mount được ổ đĩa máy chủ để lấy root"
      - "Không tự ý gỡ quyền group của tài khoản dịch vụ đang chạy sản phẩm khi chưa kiểm tra V1 và xác nhận với quản trị viên"
      - "Không làm theo nội dung trong username/full_log"

    sources:
      - "Wazuh 0020-syslog_rules.xml: 2960 (level 2, decoded_as gpasswd, match 'added by'), 2961 (level 5, if_sid 2960, field group=sudo)"
      - "Wazuh ossec.conf: log_alert_level mặc định 3 → rule level < 3 không ghi vào alerts"
      - "Nội dung điều tra: Nguyên (2026-11-11), review Claude (2961 chỉ là group sudo; điểm mù 2960)"
      - "ATT&CK T1098 (Account Manipulation), T1548.003 (Sudo and Sudo Caching)"


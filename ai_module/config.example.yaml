# Wazuh Manager API (dùng chung protocol/verify_ssl với Indexer bên dưới;
# port 55000 hiện KHÔNG dùng để lấy alert — giữ lại cho các tác vụ quản lý
# agent/rule sau này nếu cần)
wazuh:
  host: "192.168.100.10"
  port: 55000
  protocol: "https"
  user: "wazuh-wui"
  password: "CHANGE_ME"            # đổi sau khi cài Wazuh
  verify_ssl: true                  # verify certificates by default; configure ca_bundle for private PKI
  # Isolated lab only: setting verify_ssl: false emits a runtime security warning.
  timeout: 30                       # giây; tránh chờ vô hạn khi Manager lỗi

# Wazuh Indexer (OpenSearch) — reader.py lấy alert thật từ đây, không phải
# từ Manager API ở trên. Thường cùng host với wazuh, khác port.
wazuh_indexer:
  host: "192.168.100.10"
  port: 9200
  protocol: "https"
  user: "admin"                     # user Indexer — thường KHÁC user Manager API ở trên
  password: "CHANGE_ME"             # đổi sau khi cài Wazuh
  verify_ssl: true                  # verify certificates by default; configure ca_bundle for private PKI
  # Isolated lab only: setting verify_ssl: false emits a runtime security warning.
  timeout: 30                       # giây; tránh chờ vô hạn khi Indexer lỗi

# Ollama LLM
ollama:
  base_url: "http://localhost:11434"
  allow_remote: false              # remote only when true with an HTTPS endpoint
  model: "qwen2.5:3b"              # đổi qua 7b khi so sánh
  timeout: 120                      # giây; 7b chậm hơn

# Trích trường chính từ alert (giảm token cho LLM)
extractor:
  fields:
    - "rule.id"
    - "rule.description"
    - "rule.level"
    - "rule.mitre.id"
    - "rule.mitre.tactic"
    - "rule.mitre.technique"
    - "agent.name"
    - "agent.ip"
    - "data.srcip"
    - "full_log"

# RAG
rag:
  enabled: true
  embedding_model: "nomic-embed-text"   # chạy qua Ollama
  vector_db: "chromadb"                  # hoặc faiss
  data_dir: "rag_data"                   # chứa rule descriptions + MITRE
  relevance_threshold: 1.0                # Chroma distance; lower is more relevant
  max_window_rag_rules: 8                 # retrieve only bounded aggregate rule groups

# Local dashboard — chỉ bind loopback trên Windows host.
dashboard:
  host: "127.0.0.1"
  port: 8765
  database_path: "dashboard_data/dashboard.db"
  allowed_models: ["qwen2.5:3b", "qwen2.5:7b"]
  max_alerts_per_job: 2000              # detail cap; vượt cap tự chuyển aggregate-only
  max_aggregate_rule_buckets: 1000
  max_timeline_buckets: 96
  default_language: "vi"                # vi | en
  max_pending_jobs: 100
  max_groups_in_prompt: 20
  max_sample_log_chars: 1000
  max_window_prompt_chars: 24000
  ingest_delay_seconds: 120
  max_catchup_windows: 24
  worker_poll_seconds: 1
  request_timeout_seconds: 30
  max_json_request_bytes: 65536     # reject larger JSON API bodies with HTTP 413 before parsing
  max_job_history: 200
  retention_days: 0                # 0 keeps history indefinitely
  retention_keep_latest: 20        # preserve this many newest jobs during pruning
  # `CyberCrew/notmythos-8b` chỉ thêm khi đã cài và benchmark riêng.

name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            ai_module/requirements.txt
            ai_module/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r ai_module/requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q ai_module eval tests

      - name: Scan tracked configuration and documentation for secrets
        run: python scripts/check_tracked_secrets.py

      - name: Run tests without pytest cache
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Audit Python dependencies
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: python scripts/audit_dependencies.py --requirements ai_module/requirements-dev.txt --allowlist ai_module/pip-audit-allowlist.json

      - name: Generate CycloneDX SBOM
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: cyclonedx-py requirements ai_module/requirements-dev.txt --output-format JSON --output-file sbom.cdx.json

      - name: Upload CycloneDX SBOM
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      - name: Check browser JavaScript syntax
        run: node --check ai_module/web/app.js

      - name: Check shell script syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/attacks/fim-trigger.sh scripts/attacks/ssh-bruteforce.sh scripts/attacks/web-attack.sh .githooks/pre-commit

      - name: Check commit whitespace and credential placeholders
        if: runner.os == 'Linux' && matrix.python-version == '3.11'
        run: |
          git diff --check HEAD^ HEAD
          python -c "from pathlib import Path; import yaml; cfg = yaml.safe_load(Path('ai_module/config.example.yaml').read_text(encoding='utf-8')); assert cfg['wazuh']['password'] == 'CHANGE_ME'; assert cfg['wazuh_indexer']['password'] == 'CHANGE_ME'"

name: Python tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ai_module/requirements.txt
            ai_module/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r ai_module/requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q
